<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <script type="module" src="../scripts/users/init_4_users.js"></script>
    <link rel="icon" href="/favicon.png?v=1" type="image/png">
    <title>Все пользователи</title>

    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">

    <script type="module" src="../scripts/users/deleteUser.js"></script>
    <script type="module" src="../scripts/users/createTableAllUsers.js"></script>
    <script src="../scripts/users/tableScript.js"></script>
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>

    <link rel="stylesheet" href="../assets/bootstrap-icons/1.13.1/bootstrap-icons.css">
    <link href="../assets/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">
    <script src="../assets/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/bootstrap-table.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/locale/bootstrap-table-ru-RU.js"></script>

    <script src="../assets/tableExport.jquery.plugin/tableExport.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/js-xlsx/xlsx.core.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/pdfmake.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/vfs_fonts.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/export/bootstrap-table-export.js"></script>

    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">

    <style>
        /* Сброс старых правил из style_modal_window.css: z-index выше backdrop (1050), убрать отступы/трансформ */
        #modal_window_edit.modal,
        #modal_window_confirmation.modal,
        #modal_window_password.modal,
        #modal_window_barcode.modal {
            z-index: 1060;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: auto;
            height: auto;
            transform: none;
            background-color: transparent;
            border: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: inherit;
        }

        /* Ширина диалогов */
        #modal_window_edit .modal-dialog { max-width: 800px; }
        #modal_window_confirmation .modal-dialog,
        #modal_window_password .modal-dialog,
        #modal_window_barcode .modal-dialog { max-width: 650px; }

        #modal_window_edit .modal-content,
        #modal_window_confirmation .modal-content,
        #modal_window_password .modal-content,
        #modal_window_barcode .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            background: #fff;
            overflow: hidden;
        }

        #modal_window_edit .modal-header,
        #modal_window_confirmation .modal-header,
        #modal_window_password .modal-header,
        #modal_window_barcode .modal-header {
            width: 100%;
            box-sizing: border-box;
            border-radius: 16px 16px 0 0;
            border-bottom: none;
            padding: 16px 20px;
            background: #4e9be5;
            color: white;
        }

        /* Шрифты как в библиотеке инструментов: менее жирные */
        #modal_window_edit .modal-title,
        #modal_window_confirmation .modal-title,
        #modal_window_password .modal-title,
        #modal_window_barcode .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            margin: 0;
        }

        #modal_window_edit .modal-header p,
        #modal_window_confirmation .modal-header p,
        #modal_window_password .modal-header p,
        #modal_window_barcode .modal-header p {
            font-weight: 400;
            margin: 0;
            margin-top: 4px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        /* Компактные отступы тела и футера, без лишнего margin */
        #modal_window_edit .modal-body,
        #modal_window_confirmation .modal-body,
        #modal_window_password .modal-body,
        #modal_window_barcode .modal-body {
            background: #fff;
            padding: 16px 20px;
            width: 90%;
            min-width: 300px;
        }

        #modal_window_edit .modal-footer,
        #modal_window_confirmation .modal-footer,
        #modal_window_password .modal-footer,
        #modal_window_barcode .modal-footer {
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 0 0 16px 16px;
        }

        #modal_window_edit .form-label,
        #modal_window_confirmation .form-label,
        #modal_window_password .form-label {
            font-weight: 700;
            color: #333;
        }

        #modal_window_edit .form-check-label,
        #modal_window_password .form-check-label {
            font-weight: 400;
        }

        #modal_window_edit .form-control::placeholder,
        #modal_window_password .form-control::placeholder {
            font-weight: 400;
            color: #6c757d;
        }

        #modal_window_edit .btn-close,
        #modal_window_confirmation .btn-close,
        #modal_window_password .btn-close,
        #modal_window_barcode .btn-close {
            filter: invert(1);
            opacity: 0.8;
        }

        .barcode-img { max-width: 100%; height: auto; border-radius: 8px; }

        /* Восстановление Bootstrap-стилей кнопок в модалках (button_style.css переопределяет все .btn) */
        #modal_window_edit .modal-footer .btn-primary,
        #modal_window_confirmation .modal-footer .btn-primary,
        #modal_window_password .modal-footer .btn-primary,
        #modal_window_barcode .modal-footer .btn-primary {
            background-color: #4e9be5;
            border-color: #4e9be5;
            color: #fff;
        }
        #modal_window_edit .modal-footer .btn-primary:hover,
        #modal_window_confirmation .modal-footer .btn-primary:hover,
        #modal_window_password .modal-footer .btn-primary:hover,
        #modal_window_barcode .modal-footer .btn-primary:hover {
            background-color: #3d8ad4;
            border-color: #3d8ad4;
            color: #fff;
        }
        #modal_window_edit .modal-footer .btn-secondary,
        #modal_window_confirmation .modal-footer .btn-secondary,
        #modal_window_password .modal-footer .btn-secondary,
        #modal_window_barcode .modal-footer .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            color: #fff;
        }
        #modal_window_edit .modal-footer .btn-secondary:hover,
        #modal_window_confirmation .modal-footer .btn-secondary:hover,
        #modal_window_password .modal-footer .btn-secondary:hover,
        #modal_window_barcode .modal-footer .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
            color: #fff;
        }
        #modal_window_edit .modal-footer .btn-danger,
        #modal_window_confirmation .modal-footer .btn-danger,
        #modal_window_password .modal-footer .btn-danger,
        #modal_window_barcode .modal-footer .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
            color: #fff;
        }
        #modal_window_edit .modal-footer .btn-danger:hover,
        #modal_window_confirmation .modal-footer .btn-danger:hover,
        #modal_window_password .modal-footer .btn-danger:hover,
        #modal_window_barcode .modal-footer .btn-danger:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
            color: #fff;
        }
    </style>
</head>
<body onload="initialization('screen_19_users')"
      class="d-flex justify-content-center" id="body">

<!-- Редактирование / добавление пользователя -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_edit" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-person-gear" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="editUserLabel">Редактирование пользователя</h5>
                        <p style="margin: 0; margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);">Заполните данные пользователя</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="user-form" style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label for="input-family" class="form-label">Фамилия:</label>
                        <input id="input-family" class="form-control" type="text" maxlength="50" placeholder="Иванов">
                    </div>
                    <div>
                        <label for="input-first-name" class="form-label">Имя:</label>
                        <input id="input-first-name" class="form-control" type="text" maxlength="50" placeholder="Пётр">
                    </div>
                    <div>
                        <label for="input-second-name" class="form-label">Отчество:</label>
                        <input id="input-second-name" class="form-control" type="text" maxlength="50" placeholder="Альбертович">
                    </div>
                    <div>
                        <label for="input-role" class="form-label">Должность:</label>
                        <select id="input-role" class="form-select">
                            <option value="3">Администратор</option>
                            <option value="5">Руководитель</option>
                            <option value="2">Кладовщик</option>
                            <option value="4">Инженер</option>
                            <option value="6">Пользователь</option>
                        </select>
                    </div>
                    <div>
                        <label for="input-barcode" class="form-label">Штрихкод:</label>
                        <div class="d-flex gap-2 align-items-center">
                            <input id="input-barcode" class="form-control" type="text">
                            <i id="btn-generate-barcode" class="bi bi-arrow-repeat action-button" style="cursor:pointer;" onclick="generateBarcode()" title="Сгенерировать штрихкод"></i>
                        </div>
                    </div>
                    <div>
                        <label for="input-code" class="form-label">Логин:</label>
                        <input id="input-code" class="form-control" type="text">
                    </div>
                    <div>
                        <label for="input-password" class="form-label">Пароль:</label>
                        <div class="d-flex align-items-center gap-2">
                            <input id="input-password" class="form-control" type="password" maxlength="45" placeholder="Введите пароль">
                            <div class="form-check flex-shrink-0">
                                <input class="form-check-input" type="checkbox" id="input-password-show" onchange="togglePasswordVisibility('input-password', this.checked)">
                                <label class="form-check-label" for="input-password-show">Показать</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-save-user" type="button" class="btn btn-primary" onclick="saveUser()">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="clearAllForm()">Очистить</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Отмена</button>
                
            </div>
        </div>
    </div>
</div>

<!-- Подтверждение удаления -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_confirmation" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-exclamation-triangle" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="confirmDeleteLabel">Удаление пользователя</h5>
                        <p style="margin: 0; margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);">Отменить действие будет невозможно.</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2" style="font-weight: 600;">Вы уверены, что хотите удалить пользователя?</p>
                <p id="role" class="mb-1" "></p>
                <p id="name_user" class="mb-0"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-danger" onclick="deleteUser()">Удалить</button>
            </div>
        </div>
    </div>
</div>

<!-- Редактирование пароля -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_password" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-key" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="passwordModalLabel">Пароль пользователя</h5>
                        <p id="login" class="mb-0" style="margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);"></p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="user" class="fw-medium mb-3"></p>
                <label for="password_input" class="form-label">Новый пароль (цифровой):</label>
                <input type="text" id="password_input" class="form-control" inputmode="numeric" pattern="\d*" maxlength="45"
                       oninput="this.value = this.value.replace(/\D/g, '')" placeholder="Введите пароль">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-primary" onclick="savePassword()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Штрихкод -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_barcode" tabindex="-1" aria-labelledby="barcodeModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-qr-code" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="barcodeModalLabel">Штрихкод пользователя № <span id="modal_user_id"></span></h5>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal_barcode_img" class="barcode-img" src="" alt="User barcode"/>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-primary" onclick="printBarcode()">Распечатать</button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex"
         style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">

            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

                <div id="users_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: visible; display:block;">
                    <table
                            id='users_table'
                            data-locale="ru-RU"
                            data-search='true'
                            data-show-refresh='false'
                            data-show-export='true'
                            data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                            data-pagination='true'
                            data-side-pagination='client'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-toolbar="#customToolsToolbar"
                    >
                        <thead>
                        <tr>
                            <th data-field='fullname' data-sortable='true'
                                data-formatter="fullNameFormatter">
                                <span title="ФИО">ФИО</span></th>
                            <th data-field='role' data-sortable='true'>
                                <span title="Роль">Роль</span></th>
                            <th data-field='barcode'><span
                                    title="Штрихкод">Штрихкод</span></th>
                            <th data-field='code' data-sortable='true'>
                                <span title="Логин">Логин</span></th>
                            <th data-field='actions' data-width="140"
                                data-formatter="actionToolsFormatter"><span
                                    title="Действия">Действия</span></th>
                        </tr>
                        </thead>
                    </table>
                    <div id="customToolsToolbar" style="display: flex;">
                        <button id="addUserButton" class="btn btn_vending" type="button"
                                onclick="openModalEdit();">
                            Добавить пользователя
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
