<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <script type="module" src="../scripts/users/init_4_users.js"></script>
    <link rel="icon" href="/favicon.png?v=1" type="image/png">
    <title>Все пользователи</title>
    <!--    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">-->
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->
    <script type="module" src="../scripts/users/deleteUser.js"></script>
    <script type="module" src="../scripts/users/createTableAllUsers.js"></script>
    <script src="../scripts/users/tableScript.js"></script>
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>

    <link rel="stylesheet" href="../assets/bootstrap-icons/1.13.1/bootstrap-icons.css">
    <link href="../assets/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">
    <script src="../assets/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/bootstrap-table.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/locale/bootstrap-table-ru-RU.js"></script>

    <!--    <link rel="stylesheet" href="../assets/jquery-resizable-columns/jquery.resizableColumns.css">-->
    <!--    <script src="../assets/jquery-resizable-columns/jquery.resizableColumns.js"></script>-->
    <!--    <script src="../assets/bootstrap-table/1.25.0/extensions/resizable/bootstrap-table-resizable.js"></script>-->

    <script src="../assets/tableExport.jquery.plugin/tableExport.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/js-xlsx/xlsx.core.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/pdfmake.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/vfs_fonts.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/export/bootstrap-table-export.js"></script>

    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
</head>
<body onload="initialization('screen_19_users')"
      class="d-flex justify-content-center" id="body">

<div id="membrane"></div>
<div id="modal_window_edit">
    <div id="user-form"
         style="display: flex; flex-direction: column; width: 90%; margin-top: 10px; padding: 10px; border: 2px solid rgb(78, 155, 229); border-radius: 5px;">
        <div class="edit-input"><span class="col-sm-4">Фамилия:</span>
            <div class="col-sm-8">
                <input id="input-family" class="form-control" type="text" maxlength="50" placeholder="Иванов">
            </div>
        </div>
        <div class="edit-input"><span class="col-sm-4">Имя:</span>
        <div class="edit-input col-sm-8">
            <input id="input-first-name" class="form-control" type="text" maxlength="50" placeholder="Пётр">
        </div>
        </div>
        <div class="edit-input"><span class="col-sm-4">Отчество:</span>
        <div class="edit-input col-sm-8">
            <input id="input-second-name" class="form-control" type="text" maxlength="50"
                   placeholder="Альбертович">
        </div>
        </div>
        <div class="edit-input"><span class="col-sm-4">Должность:</span>
        <div class="edit-input col-sm-8">
            <select id="input-role" class="form-select">
                <option value="3">Администратор</option>
                <option value="5">Руководитель</option>
                <option value="2">Кладовщик</option>
                <option value="4">Инженер</option>
                <option value="6">Пользователь</option>
            </select>
        </div>
        </div>
        <div class="edit-input"><span class="col-sm-4">Штрихкод:</span>
        <div class="edit-input col-sm-8" style="display:flex">
            <input id="input-barcode" class="form-control" type="text">
            <i id="btn-generate-barcode" class="bi bi-arrow-repeat action-button"
               onclick="generateBarcode()" title="Сгенерировать штрихкод"></i>
        </div>
        </div>
        <div class="edit-input"><span class="col-sm-4">Логин:</span>
        <div class="edit-input col-sm-8">
            <input id="input-code" class="form-control" type="text">
        </div>
        </div>
        <div class="edit-input" style="display:none"><span class="col-sm-4">Пароль:</span>
        <div class="edit-input col-sm-8">
            <input id="input-password" class="form-control" type="text" maxlength="45">
        </div>
        </div>
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn btn_vending" type="button" onclick="clearAllForm()">Очистить все поля
        </button>
        <button class="btn btn_vending" type="button" onclick="show_edit('none')">Отмена</button>
        <button id="btn-save-user" class="btn btn_vending" type="button" onclick="saveUser()">
            Сохранить
        </button>
        <!-- onclick="setupUserForm()" -->
    </div>
</div>
<div id="modal_window_confirmation">
    <span style="font-size: 24px; padding-left:10px;">Вы уверены, что хотите удалить пользователя?</span>
    <span id="role" style="display: flex; width: 80%; align-items: start; margin-top: 15px;"></span>
    <span id="name_user"
          style="display: flex; width: 80%; align-items: start; margin-top: 15px;"></span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Отменить действие будет невозможно.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад
        </button>
        <button class="btn_vending" onclick="deleteUser()">Удалить</button>
    </div>
</div>

<div id="modal_window_password">
    <span id="user" style="font-size: 24px;"></span>
    <span id="login" style="display: flex; width: 80%; align-items: start; margin-top: 15px;"></span>
    <span id="password" style="display: flex; width: 80%; align-items: start; margin-top: 15px;">
      <input type="text" id="password_input" style="width: 100%;" inputmode="numeric" pattern="\d*"
             oninput="this.value = this.value.replace(/\D/g, '')"/>
    </span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn_vending" onclick="show_password('none')" style="margin-right: 20px;">Назад
        </button>
        <button class="btn_vending" onclick="">Сохранить</button>
    </div>
</div>

<!-- Разметка модалки -->
<div id="modal_window_barcode" class="modal-overlay">
    <div class="modal-content">
        <span class="plan_name">Пользователь №: <span id="modal_user_id"></span></span>
        <img id="modal_barcode_img" class="barcode-img" src="" alt="User barcode"/>
        <div class="modal-actions">
            <button class="btn_vending" onclick="showBarcode('none')">Назад</button>
            <button class="btn_vending" onclick="printBarcode()">Распечатать</button>
        </div>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3"
         style="width: 100%;height: 100px;margin-top: 10px;margin-left: 0px;">
    </nav>
    <div class="d-flex"
         style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">

            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 10px;">

                <div id="users_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: visible; display:block;">
                    <table
                            id='users_table'
                            data-locale="ru-RU"
                            data-search='true'
                            data-show-columns='true'
                            data-show-refresh='false'
                            data-show-toggle='true'
                            data-show-export='true'
                            data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                            data-pagination='true'
                            data-side-pagination='client'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-toolbar="#customToolsToolbar"
                    >
                        <thead>
                        <tr>
                            <th data-field='fullname' data-sortable='true'
                                data-formatter="fullNameFormatter">
                                <span title="ФИО">ФИО</span></th>
                            <th data-field='role' data-sortable='true'>
                                <span title="Роль">Роль</span></th>
                            <th data-field='barcode'><span
                                    title="Штрихкод">Штрихкод</span></th>
                            <th data-field='code' data-sortable='true'>
                                <span title="Логин">Логин</span></th>
                            <th data-field='password' data-width="100"
                                data-formatter="passwordFormatter">
                                <span title="Пароль">Пароль</span></th>
                            <th data-field='actions' data-width="140"
                                data-formatter="actionToolsFormatter"><span
                                    title="Действия">Действия</span></th>
                        </tr>
                        </thead>
                    </table>
                    <div id="customToolsToolbar" style="display: flex;">
                        <button id="addUserButton" class="btn btn_vending" type="button"
                                onclick="openModalEdit();">
                            Добавить пользователя
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
