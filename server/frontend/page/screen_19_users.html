<body onload="initialization('screen_19_users')"
      class="d-flex justify-content-center" id="body">

<!-- Редактирование / добавление пользователя -->
<div class="modal fade modal-dialog-scrollable vending-modal-window" id="modal_window_edit" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-person-gear" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="editUserLabel">Редактирование пользователя</h5>
                        <p style="margin: 0; margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);">Заполните данные пользователя</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="user-form" style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label for="input-family" class="form-label">Фамилия:</label>
                        <input id="input-family" class="form-control" type="text" maxlength="50" placeholder="Иванов">
                    </div>
                    <div>
                        <label for="input-first-name" class="form-label">Имя:</label>
                        <input id="input-first-name" class="form-control" type="text" maxlength="50" placeholder="Пётр">
                    </div>
                    <div>
                        <label for="input-second-name" class="form-label">Отчество (необязательно):</label>
                        <input id="input-second-name" class="form-control" type="text" maxlength="50" placeholder="Альбертович">
                    </div>
                    <div>
                        <label for="input-role" class="form-label">Должность:</label>
                        <select id="input-role" class="form-select">
                            <option value="3">Администратор</option>
                            <option value="5">Руководитель</option>
                            <option value="2">Кладовщик</option>
                            <option value="4">Инженер</option>
                            <option value="6">Пользователь</option>
                        </select>
                    </div>
                    <div>
                        <label for="input-barcode" class="form-label">Штрихкод:</label>
                        <div class="d-flex gap-2 align-items-center">
                            <input id="input-barcode" class="form-control" type="text">
                            <i id="btn-generate-barcode" class="bi bi-arrow-repeat action-button" style="cursor:pointer;" onclick="generateBarcode()" title="Сгенерировать штрихкод"></i>
                        </div>
                    </div>
                    <div>
                        <label for="input-code" class="form-label">Логин:</label>
                        <input id="input-code" class="form-control" type="text">
                    </div>
                    <div>
                        <label for="input-password" class="form-label">Пароль:</label>
                        <div class="d-flex align-items-center gap-2">
                            <input id="input-password" class="form-control" type="password" maxlength="45" placeholder="Введите пароль">
                            <div class="form-check flex-shrink-0">
                                <input class="form-check-input" type="checkbox" id="input-password-show" onchange="togglePasswordVisibility('input-password', this.checked)">
                                <label class="form-check-label" for="input-password-show">Показать</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-save-user" type="button" class="btn btn-primary" onclick="saveUser()">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="clearAllForm()">Очистить</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Отмена</button>
                
            </div>
        </div>
    </div>
</div>

<!-- Подтверждение удаления -->
<div class="modal fade modal-dialog-scrollable vending-modal-window" id="modal_window_confirmation" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-exclamation-triangle" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="confirmDeleteLabel">Удаление пользователя</h5>
                        <p style="margin: 0; margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);">Отменить действие будет невозможно.</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2" style="font-weight: 600;">Вы уверены, что хотите удалить пользователя?</p>
                <p id="role" class="mb-1"></p>
                <p id="name_user" class="mb-0"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-danger" onclick="deleteUser()">Удалить</button>
            </div>
        </div>
    </div>
</div>

<!-- Редактирование пароля -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_password" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-key" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="passwordModalLabel">Пароль пользователя</h5>
                        <p id="login" class="mb-0" style="margin-top: 4px; font-size: 0.95rem; color: rgba(255,255,255,0.9);"></p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="user" class="fw-medium mb-3"></p>
                <label for="password_input" class="form-label">Новый пароль (цифровой):</label>
                <input type="text" id="password_input" class="form-control" inputmode="numeric" pattern="\d*" maxlength="45"
                       oninput="this.value = this.value.replace(/\D/g, '')" placeholder="Введите пароль">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-primary" onclick="savePassword()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Штрихкод -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_barcode" tabindex="-1" aria-labelledby="barcodeModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-qr-code" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="barcodeModalLabel">Штрихкод пользователя № <span id="modal_user_id"></span></h5>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" aria-label="Закрыть" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal_barcode_img" class="barcode-img" src="" alt="User barcode"/>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
                <button type="button" class="btn btn-primary" onclick="printBarcode()">Распечатать</button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex"
         style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">

            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

                <div id="users_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: visible; display:block;">
                    <table
                            id='users_table'
                            data-locale="ru-RU"
                            data-search='true'
                            data-show-refresh='false'
                            data-show-export='true'
                            data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                            data-pagination='true'
                            data-side-pagination='client'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-toolbar="#customToolsToolbar"
                    >
                        <thead>
                        <tr>
                            <th data-field='fullname' data-sortable='true'
                                data-formatter="fullNameFormatter">
                                <span title="ФИО">ФИО</span></th>
                            <th data-field='role' data-sortable='true'>
                                <span title="Роль">Роль</span></th>
                            <th data-field='barcode'><span
                                    title="Штрихкод">Штрихкод</span></th>
                            <th data-field='code' data-sortable='true'>
                                <span title="Логин">Логин</span></th>
                            <th data-field='actions' data-width="140"
                                data-formatter="actionToolsFormatter"><span
                                    title="Действия">Действия</span></th>
                        </tr>
                        </thead>
                    </table>
                    <div id="customToolsToolbar" class="custom-toolbar-content" style="display: flex;">
                        <button id="addUserButton" class="btn btn_vending" type="button"
                                onclick="openModalEdit();">
                            Добавить пользователя
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
