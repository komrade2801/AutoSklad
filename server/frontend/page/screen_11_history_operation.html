<body onload="initialization('screen_11_history_operation')" class="d-flex justify-content-center bg-theme-gradient" id="body">
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
    <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
    </div>
    <div class="tab-pane fade show active d-flex"
         style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
        <div id="printArea" style="display:none;"></div>
        <div id="column-1" class="d-flex"
             style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

            <div id="history_operation_div" class="panel-body"
                 style="width: 100%; height: 100%; display:block;">
                <table
                    id='operation_history_table'
                    data-locale="ru-RU"
                    data-resizable='true'
                    data-search='true'
                    data-show-refresh='false'
                    data-show-export='true'
                    data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                    data-pagination='true'
                    data-side-pagination='client'
                    data-row-style='rowStyle'
                    data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                    data-page-size="25"
                    data-filter-control="true"
                    data-toolbar="#customToolsToolbar"
                    >
                    <thead>
                        <tr>
<!--                            <th data-field="state" data-checkbox="true"></th>-->
                            <th data-field='date' data-sortable='true' data-sorter='dateTimeSorter'><span title="Дата">Дата</span></th>
                            <th data-field='name_operation' data-sortable='true' data-filter-control="select" data-filter-data="func:getStatusDescriptions" data-search-formatter="true" data-formatter="statusDescriptionFormatter"><span title="Наименование операции">Операция</span></th>
                            <th data-field='description'><span title="Описание операции">Описание</span></th>
                            <th data-field='tool' data-sortable='true' data-filter-control="input"><span title="Наименование инструмента">Инструмент</span></th>
                            <th data-field='plan' data-sortable='true' data-filter-control="input"><span title="Обозначение чертежа">Чертеж</span></th>
                            <th data-field='user' data-sortable='true' data-filter-control="select"><span title="Имя пользователя">Пользователь</span></th>
                            <th data-field='device' data-sortable='true' data-filter-control="select"><span title="Наименование аппарата">Аппарат</span></th>
                        </tr>
                    </thead>
                </table>
                <script>
                    //column custom formatter
                    function dateTimeSorter(a, b) {

                        var a_number = datnum(a, "HH:mm:ss DD.MM.YYYY");
                        var b_number = datnum(b, "HH:mm:ss DD.MM.YYYY");

                        a = a_number;
                        b = b_number;
                        if (a > b) return 1;
                        if (a < b) return -1;
                        return 0;
                    }

                    //return integer
                    function datnum(dateString, format) {
                        var date;
                        try {
                            date = moment(dateString, format);
                            return date.valueOf();
                        //    date = new Date(dateString)
                        //    return date.getTime();
                        }catch {
                            return 0;
                        }

                        return 0;
                    }

                    function getStatusDescriptions() {
                        const data = $('#operation_history_table').bootstrapTable('getData');
                        const statusSet = new Set();
                        for (const item of data) {
                            statusSet.add(item.operation_status);
                        }
                        const statusArrayObject = {};
                        for (const status of statusSet) {
                            if (status in window.appData.statusData) {
                                statusArrayObject[window.appData.statusData[status]] = window.appData.statusData[status];
                            }
                        }
                        return statusArrayObject;
                    }

                    function statusDescriptionFormatter(value, row, index, field) {
                    //    console.log(value);
                    //    console.log(row);
                    //    console.log(index);
                    //    console.log(field);

                        return window.appData.statusData[row.operation_status];
                    }

                    function searchByDescription(text, value, field, data) {
                        console.log(text);
                        console.log(value);
                        console.log(field);
                        console.log(data);

                        for (const operation of data) {
                        //    console.log(operation['operation_status']);
                            if (operation.operation_status == text) {
                                return true;
                            } else {
                                return false;
                            }
                        }
                    }
                    </script>
                </table>
                <div id="customToolsToolbar" style="">
                    <button id="printHistory" class="btn btn_vending" type="button" onclick="printMassOperation()"
                            style="margin-right: 20px">Печать
                    </button>
                </div>
            </div>
        </div>
      </div>

</body>
