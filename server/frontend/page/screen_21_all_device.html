<!DOCTYPE html>
<html lang="en" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Все устройства</title>
    <script type="module" src="../scripts/all_device/init.js"></script>
    <script type="module" src="../scripts/all_device/modal_window.js"></script>
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/all_device/style_modal_window.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <style>
      .btn_vending {
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(black, rgb(131,173,239) 1%, rgb(120,158,217) 97%, white), rgb(0,49,114);
        border-color: rgb(255, 255, 255);
        border-radius: 5px;
        color: rgb(0,49,114);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .btn_vending_active {
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgb(0,49,114);
        border-color: rgb(80, 130, 179);
        border-radius: 5px;
        color: rgb(199, 224, 249);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .search-container {
            position: relative;
            width: 140px;
      }

      .search-input {
          width: 100%;
          height: 30px;
          padding-right: 30px;
          box-sizing: border-box;
          border: 1px solid #ccc;
          border-radius: 4px;
          outline: none;
      }

      .search-icon {
          position: absolute;
          top: 50%;
          right: 5px;
          transform: translateY(-50%);
          cursor: pointer;
      }

       .suggestions {
           position: absolute;
           top: 35px;
           width: 100%;
           border: 1px solid #ccc;
           border-top: none;
           background: white;
           z-index: 1000;
           border-radius: 0 0 4px 4px;
           max-height: 150px;
           overflow-y: auto;
           display: none;
       }

       .suggestions div {
           padding: 5px;
           cursor: pointer;
       }

       .suggestions div:hover {
           background-color: #f0f0f0;
       }
    </style>
</head>
<body onload="initialization('screen_21_all_device')" class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
  <div id="membrane"></div>
  <div id="modal_window_detail">
    <span id="device_number" style="font-size: 20px; font-weight: bold;"></span>
    <span id="device_name" style="margin-top: 10px;"></span>
    <span id="device_description" style="margin-top: 10px;"></span>

    <div id="device_details"></div>

    <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
      <button class="btn_vending" onclick="show_detail('none')">Закрыть</button>
    </div>
  </div>
  <div id="modal_window_confirmation">
    <span style="font-size: 24px; padding-left: 10px;">Вы уверены, что хотите удалить устройство?</span>
    <span id="number_device" style="display: flex; width: 80%; align-items: start; margin-top: 15px;"></span>
    <span id="name_device" style="display: flex; width: 80%; align-items: start; margin-top: 15px;"></span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Отменить действие будет невозможно.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending" onclick="deleteDevice(serialNumber)">Удалить</button>
    </div>
  </div>
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3" style="width: 100%;height: 100px;margin-top: 10px;margin-left: 0px;">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
    <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
    </div>
    <div class="tab-pane fade show active d-flex" style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
        <div id="column-1" class="d-flex" style="flex-direction: column; width: calc(100% - 225px); height: 100%; align-items: center; padding: 10px;">
        </div>
        <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; justify-content: space-between; width: 225px; height: 100%; margin-right: 10px;">
          <div style="width: 100%; height: 70px; margin-top: 10px;">
            <button class="btn_vending" type="button" onclick="window.location.href='./screen_22_append_device.html?token='+localStorage.getItem('token');" style="margin-top: 10px;">Добавить устройство</button>
          </div>
          <div style="width: 100%; margin-bottom: 10px;">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
