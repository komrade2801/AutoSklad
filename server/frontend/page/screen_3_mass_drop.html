<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <title>Массовая выгрузка</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/massdrop/style_modal_window.css">
    <script type="module" src="../scripts/massdrop/init_drop.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
    <script type="module" src="../scripts/massdrop/history_drop.js?v=1"></script>
    <script type="module" src="../scripts/massdrop/saveHistoryAsMassDrop.js"></script>
    <style>
      .btn_vending {
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(black, rgb(131,173,239) 1%, rgb(120,158,217) 97%, white), rgb(0,49,114);
        border-color: rgb(255, 255, 255);
        border-radius: 5px;
        color: rgb(0,49,114);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .btn_vending_active {
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgb(0,49,114);
        border-color: rgb(80, 130, 179);
        border-radius: 5px;
        color: rgb(199, 224, 249);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .search-container {
            position: relative;
            width: 140px;
      }

      .search-input {
          width: 100%;
          height: 30px;
          padding-right: 30px;
          box-sizing: border-box;
          border: 1px solid #ccc;
          border-radius: 4px;
          outline: none;
      }

      .search-icon {
          position: absolute;
          top: 50%;
          right: 5px;
          transform: translateY(-50%);
          cursor: pointer;
      }

       .suggestions {
           position: absolute;
           top: 35px;
           width: 100%;
           border: 1px solid #ccc;
           border-top: none;
           background: white;
           z-index: 1000;
           border-radius: 0 0 4px 4px;
           max-height: 150px;
           overflow-y: auto;
           display: none;
       }

       .suggestions div {
           padding: 5px;
           cursor: pointer;
       }

       .suggestions div:hover {
           background-color: #f0f0f0;
       }
    </style>
</head>
<body onload="initialization('screen_3_mass_drop');"
      class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
  <div id="membrane"></div>
  <div id="modal_window_cell">
    <span class="cell_number" style="font-size: 24px;">Ячейка №</span>
    <img src="..\..\assets\img\web\icons8-led-16.png" style="width: 200px; height: 110px; margin-top: 15px;">
    <span class="tool_name" style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Инструмент: </span>
    <span class="tool_group" style="display: flex; width: 80%; align-items: start; margin-top: 10px;">Группа: </span>
    <span class="plan_name" style="display: flex; width: 80%; align-items: start; margin-top: 10px;">Чертёж: </span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="show('none')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending upload" onclick="handleUnloadClick(this)">Выгрузить</button>
    </div>
  </div>
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3" style="width: 100%; height: 100px; margin-top: 10px; margin-left: 0px;">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
      <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
      </div>
      <div class="tab-pane fade show active d-flex" style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
          <div id="column-1" class="d-flex" style="flex-direction: column; width: calc(80% - 225px); height: 100%; align-items: center;">
            <div id="cells-container" style="overflow-y: visible; margin-top: 10px; width: 97%; height: calc(100% - 59px); overflow-x: auto; padding: 1px; border-style: solid; border-color: rgb(255, 255, 255); border-width: 0.5px; border-radius: 5px;"></div>
              <div class="d-flex container-fluid" style="margin-top: 15px; margin-bottom: 10px; flex-direction: row; justify-content: space-evenly; align-items: center;">
                <div class="d-flex">
                  <span style="color: #979797; font-size: 16px; font-weight: bold; padding-right: 5px">⬤</span>
                  <span style="color: rgb(0,49,114); font-size: 16px; font-weight: bold;">Пустые</span>
                </div>
                <div class="d-flex">
                  <span style="color: #007e0f; font-size: 16px; font-weight: bold; padding-right: 5px">⬤</span>
                  <span style="color: rgb(0,49,114); font-size: 16px; font-weight: bold;">Занятые по чертежу</span>
                </div>
                <div class="d-flex">
                  <span style="color: #001fff; font-size: 16px; font-weight: bold; padding-right: 5px">⬤</span>
                  <span style="color: rgb(0,49,114); font-size: 16px; font-weight: bold;">Занятые свободные</span>
                </div>
                <div class="d-flex">
                  <span style="color: #003172; font-size: 16px; font-weight: bold; padding-right: 5px">⬤</span>
                  <span style="color: rgb(0,49,114); font-size: 16px; font-weight: bold;">Текущая выгрузка</span>
                </div>
            </div>
          </div>
          <div id="column-2" class="d-flex" style="display: flex; flex-direction: column; width: 20%; height: 100%; align-items: start;">
            <div style="display: flex; flex-direction: row; width: 93%; height: 30px; margin-top: 10px;">
              <form class="d-flex" role="search" style="width: 100%;">
                <input class="form-control me-2" type="search" placeholder="Поиск инструмента" aria-label="Поиск">
                <button class="btn" type="submit" style="width: 30px; display: flex; justify-content: center; align-items: center; border-color: rgb(153, 153, 153);">
                  <img src="../assets/img/loupe.png" style="width: 20px; height: 20px; pointer-events: none;">
                </button>
              </form>
            </div>
            <div id="tools-container" class="d-flex" style="display: flex; flex-direction: column; margin-top: 5px; width: 93%; height: 60%; overflow-x: auto; padding: 1px; border-style: solid; border-color: rgb(255, 255, 255); border-width: 0.5px; border-radius: 5px;"></div>
            <span class="d-flex" style="margin-top: 10px; color: rgb(0,49,114); font-size: 20px; font-weight: bold; width: 93%;">История текущей выгрузки:</span>
            <div id="history" style="overflow-y: auto;  margin-top: 5px; margin-bottom: 10px; width: 93%; height: calc(40% - 100px); padding: 1px; border-style: solid; border-color: rgb(255, 255, 255); border-width: 0.5px; border-radius: 5px;"></div>
          </div>
          <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; justify-content: space-between; width: 225px; height: 100%; margin-right: 10px;">
            <div style="width: 100%; height: 70px; margin-top: 10px;"></div>
            <div class="card" style="width: 225px; border: 20px; border-radius: 5px; border-color: rgb(0,49,114); font-size: 16px;">
              <div class="card-body" style="color: rgb(0,49,114); padding: 10px;">
                <h6 class="card-title" >Подсказка:</h6>
                <p class="card-text" style="font-family: Arial;">Для выгрузки нажмите на ячейку или на стрелку в списке инструмента.</p>
              </div>
            </div>
            <div style="width: 100%; margin-bottom: 10px;">
              <button class="btn_vending" type="button">Отмена всей выгрузки</button>
              <button class="btn_vending" type="button" onclick="saveHistoryAsMassDrop(1)">Сохранить выгрузку</button>
            </div>
          </div>
      </div>
    </div>
  </div>
