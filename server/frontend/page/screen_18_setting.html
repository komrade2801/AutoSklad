<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="icon" href="/favicon.png?v=1" type="image/png">

    <script type="module" src="../scripts/setting/init.js"></script>
    <title>Настройка</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <script src="../scripts/setting/modal_window.js"></script>
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
<!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/setting/main.css">
</head>

<body onload="initialization('screen_18_setting')" class="d-flex justify-content-center" id="body"
        style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
    <div id="membrane"></div>
    <div id="modal_window_confirmation">
    <span style="font-size: 24px; padding-left: 10px;">Вы уверены, что хотите сделать сброс настроек?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Все данные из Базы Данных будут удалены, отменить это действие будет невозможно.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад</button>
        <button class="btn_vending" onclick="startSetup()">Сброс настроек</button>
        </div>
    </div>
    <div id="modal_window_factory_reset">
    <span style="font-size: 24px; padding-left: 10px;">Сброс к заводским настройкам</span>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">0%</div>
    <div class="messages" id="messages"></div>
    </div>
    <div id="modal_window_finish">
        <span style="font-size: 24px;">Готово!</span>
        <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button id="in_screen_user_out_btn" class="btn_vending" type="button" onclick="window.location.href='/'; localStorage.removeItem('token')">Ок</button>
    </div>
    </div>
    <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
        <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
        </nav>
        <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
            <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px; flex-shrink: 0;">
            </div>
            <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load" style="flex-direction: row; flex-wrap: nowrap; flex: 1; height: 100%; padding: 0px;">
                <div id="column-1" class="d-flex" style="flex-direction: column; height: 100%; align-items: center; justify-content: center; padding-top: 0; padding-left: 10px"></div>
                <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; align-items: flex-end; width: 225px; height: 100%; gap: 5px; flex-shrink: 0; flex-grow: 0; padding-top: 0;">
                    <button class="btn_vending" onclick="saveAllSettings()" id="saveButton" style="width: 225px; height: 35px; font-size: 16px;">Сохранить</button>
                    <button class="btn_vending" onclick="openModalConf()" id="startButton" style="width: 225px; height: 35px; font-size: 16px;">Сброс настроек</button>
                    <div id="factoryResetWarning" style="display:none; width:100%; color:#ffb74d; font-size:14px; text-align:center; margin-top:8px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let isProcessing = false;

        async function updateProgress() {
            const response = await fetch('/progress');
            const data = await response.json();

            // Update progress bar
            document.getElementById('progressFill').style.width = data.percentage + '%';
            document.getElementById('progressText').textContent =
                `${data.stage} (${data.percentage}%)`;

            // Update messages
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = data.messages.map(msg => `<div>${msg}</div>`).join('');

            // Auto-scroll messages
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Check for 100% progress
            if (data.percentage === 100) {
                show_factory_reset('none');
                openModalFinish();
            }

            // Update button state
            const button = document.getElementById('startButton');
            if (typeof window.setFactoryResetLock === 'function') {
                window.setFactoryResetLock(data.status === 'in_progress');
            }

            if (data.status === 'in_progress') {
                button.disabled = true;
                button.textContent = 'Processing...';
                setTimeout(updateProgress, 1000);
            } else {
                button.disabled = false;
                button.textContent = 'Start Setup';
            }
        }

        async function startSetup() {
            show_conf('none')
            openModalFactoryReset()

            if (isProcessing) return;

            isProcessing = true;
            document.getElementById('startButton').disabled = true;
            if (typeof window.setFactoryResetLock === 'function') {
                window.setFactoryResetLock(true);
            }

            try {
                const response = await fetch('/start', {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.error) {
                    showToast(result.error, 'danger');
                } else {
                    updateProgress();
                }
            } catch (error) {
                showToast('Error starting setup: ' + error.message, 'danger');
                if (typeof window.setFactoryResetLock === 'function') {
                    window.setFactoryResetLock(false);
                }
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
