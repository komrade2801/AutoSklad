      .search-container {

      }

         .tab-change-bar {

<body onload="initialization('screen_8_append_plan')" class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
  <div id="membrane"></div>
  <div id="modal_window_confirmation">
    <span style="font-size: 24px;">Вы уверены, что хотите отменить добавление чертежа?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Введённые данные не сохранятся.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="window.location.href='/screen_7_plans.html?token='+localStorage.getItem('token')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending" onclick="window.location.href='/screen_7_plans.html?token='+localStorage.getItem('token')">Отменить добавление</button>
    </div>
  </div>
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3" style="width: 100%;height: 100px;margin-top: 10px;margin-left: 0px;">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
    <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
    </div>
    <div class="tab-pane fade show active d-flex" style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
        <div id="column-1" class="d-flex" style="flex-direction: column; width: calc(50% - 112px); height: 100%; align-items: center; padding: 10px;">
          <div style="display: flex; flex-direction: row; width: 100%; height: 30px; margin-top: 10px;">
            <form class="d-flex" role="search" style="width: 100%;">
              <input class="form-control me-2" type="search" placeholder="Поиск инструмента" aria-label="Поиск" oninput="performSearch(this)">
<!--              <button class="btn" type="submit" style="width: 30px; display: flex; justify-content: center; align-items: center; border-color: rgb(153, 153, 153);">-->
<!--                <img src="../assets/img/loupe.png" style="width: 20px; height: 20px; pointer-events: none;">-->
<!--              </button>-->
            </form>
              <script>
                  function performSearch(input) {
                    const searchText = input.value.toLowerCase();
                    if (searchText == '') {
                        $(".library-tool-div").show();
                    } else {
                        $(".library-tool-div").hide();
                        $(".library-tool-div").filter(function() {
                            return $(this).attr('data-tool-name').toLowerCase().indexOf(searchText) > -1;
                        }).show();
                    }
                  }
              </script>
          </div>
          <div class="d-flex" id="tools" style="flex-direction: column; width: 100%; overflow-y: scroll; margin-top: 5px;"></div>
        </div>
        <div id="column-2" style="display: flex; flex-direction: column; width: calc(50% - 113px); height: 100%; box-sizing: border-box; padding: 10px;">
            <div style="display: flex; flex-direction: column; width: 100%; height: 100%; border: 2px solid rgb(78, 155, 229); border-radius: 5px; padding: 10px; box-sizing: border-box;">
                <div id="qrCodeBlock">
                    <div class="btn-group btn-group-toggle tab-change-bar" data-toggle="buttons">
                        <input type="radio" class="btn-check" name="options-tabs" id="tab1" value="qr" autocomplete="off" checked>
                        <label class="btn btn-outline-tabs btn-lg" for="tab1">Сканирование QR-кода</label>

                        <input type="radio" class="btn-check" name="options-tabs" id="tab2" value="auto" autocomplete="off">
                        <label class="btn btn-outline-tabs btn-lg" for="tab2">Ввести вручную</label>
                    </div>
                    <script>
                        $("input[name=options-tabs]").change(function () {
                            console.log(this.value);
                            const elements = document.getElementsByClassName('plan-input');
                            for (elem of elements) {
                                if(this.value == "qr"){
                                    elem.disabled = true;
                                } else {
                                    elem.disabled = false;
                                }
                            }
                            const element = document.getElementById('qrCodeInput');
                            if(this.value == "qr"){
                                element.disabled = false;
                            } else {
                                element.disabled = true;
                            }
                        });


                    </script>

                    <div style="padding-bottom: 20px;">
                        <textarea id="qrCodeInput" class="form-control me-2 plan-qr" placeholder="Отсканируйте QR-код" style="margin-top: 5px;" onkeydown="fillManualFields(this)"></textarea>
                        <label class="form-check-label" for="qrCodeInput">
                            Первая строка из QR-кода - обозначение чертежа
                        </label>
                    </div>
                </div>
                <div id="manualBlock">
                    <span style="width: 100%; padding-left: 10px;">Предприятие:</span>
                  <input id="enterpriseInput" class="form-control me-2 plan-input" type="text" placeholder="ООО АзовСталь" style="margin-top: 5px;" disabled>
                  <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Номер чертежа:</span>
                  <input id="designationInput" class="form-control me-2 plan-input" type="text" placeholder="XXXX.DDDD.xxxx.xxxx.xxxx" disabled>
                  <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Название чертежа:</span>
                  <input id="nameInput" class="form-control me-2 plan-input" type="text" placeholder="Втулка стальная 5мм." disabled>
                  <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Описание чертежа:</span>
                  <input id="descriptionInput" class="form-control me-2 plan-input" type="text" placeholder="Описание чертежа." disabled>
                </div>
                <div class="form-check checkbox-option">
                    <input class="form-check-input" type="checkbox" value="" id="createMassLoad" checked>
                    <label class="form-check-label" for="createMassLoad">
                        Сгенерировать массовую загрузку
                    </label>
                </div>
              <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Инструмент для чертежа:</span>
              <div id="selection_tools" class="d-flex dropable"
                   style="display: flex; flex-direction: column; flex-grow: 1; margin-top: 5px; padding: 5px; padding-bottom: 50px; box-sizing: border-box; overflow-y: auto; border-radius: 5px; border: 1px solid rgb(255, 255, 255);">
              </div>
            </div>
            <script>
                var qr_rows = []
                function fillManualFields(elem) {
                //    console.log(event.key)
                    if (event.key === 'Tab') {
                        event.preventDefault();
                        console.log(elem.value);

                        qr_rows.push(elem.value);
                        elem.value = '';
                    }
                    if(event.key === 'Enter') {

                        fetch("/backend/qr/", {
                            method: 'POST',
                            headers: {
                              'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({'content': qr_rows})
                          })
                          .then(response => {
                            if (!response.ok) {
                              return response.text().then(text => {
                                throw new Error(`Ошибка ${response.status}: ${text}`);
                              });
                            }
                            return response.json();
                          })
                          .then(data => {
                            console.log('Результат декодировки:', data);

                            const enterpriseInput = document.getElementById('enterpriseInput');
                            const designationInput = document.getElementById('designationInput');
                            const nameInput = document.getElementById('nameInput');
                            const descriptionInput = document.getElementById('descriptionInput');

                            enterpriseInput.value = data.content[3];
                            designationInput.value = data.content[0];
                            nameInput.value = data.content[5];
                            descriptionInput.value = data.content[4];

                            const qrCodeInput = document.getElementById('qrCodeInput');
                            qrCodeInput.placeholder = 'QR-код отсканирован успешно'
                            qrCodeInput.blur();
                            qrCodeInput.value = '';

                            qr_rows = []
                          })
                          .catch(err => {
                            console.error('Ошибка при декодировании:', err);
                          });
                    }
                }
            </script>
        </div>
        <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; justify-content: space-between; width: 225px; height: 100%; margin-right: 10px;">
<!--          <div style="width: 100%; height: 70px; margin-top: 10px;">-->
<!--            <button class="btn_vending" type="button">Загрузить из 1С</button>-->
<!--          </div>-->
          <div class="card" style="width: 225px; border: 20px; border-radius: 5px; border-color: rgb(0,49,114); font-size: 16px;">
            <div class="card-body" style="color: rgb(0,49,114); padding: 10px;">
              <h6 class="card-title" >Подсказка:</h6>
              <p class="card-text" style="font-family: Arial;">Перетащите весь необходимый инструмент в соответственное поле. Количество можно будет уточнить позже.</p>
            </div>
          </div>
          <div style="width: 100%; margin-bottom: 10px;">
            <button class="btn_vending" type="button" onclick="clearAllForm()">Очистить все поля</button>
            <button class="btn_vending" type="button" onclick="openModalConf()">Отмена</button>
            <button id="saveButton" class="btn_vending" type="button" onclick="save_all_plans(1, jsonPlan)">Сохранить</button>
          </div>
