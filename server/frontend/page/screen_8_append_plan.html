<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="icon" href="/favicon.png?v=1" type="image/png">

    <title>Добавление чертежа</title>
    <!--    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">-->
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">

    <link rel="stylesheet" href="../assets/bootstrap-icons/1.13.1/bootstrap-icons.css">
    <link href="../assets/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">
    <script src="../assets/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/bootstrap-table.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/locale/bootstrap-table-ru-RU.js"></script>

    <script src="../assets/tableExport.jquery.plugin/tableExport.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/js-xlsx/xlsx.core.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/pdfmake.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/vfs_fonts.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/export/bootstrap-table-export.js"></script>

    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
    <!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->

    <script src="../scripts/append_plan/clear_all_form.js"></script>
    <script src="../scripts/append_plan/modal_window.js"></script>
    <script type="module" src="../scripts/append_plan/init_8_append_plan.js?v=2"></script>
    <script type="module" src="../scripts/append_plan/save_script.js"></script>
    <script type="module" src="../scripts/append_plan/selected_tools.js"></script>
    <script src="../scripts/append_plan/manualFields.js"></script>
    <script src="../scripts/append_plan/tableScript.js"></script>

    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/append_plan/input_amount.css">
</head>
<body onload="initialization('screen_8_append_plan')" class="d-flex justify-content-center" id="body">
<div id="membrane"></div>
<div id="modal_window_cell">
    <span class="tool_name"
          style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Инструмент: </span>
    <span class="tool_sum" style="display: flex; width: 80%; align-items: start; margin-top: 10px;">В наличии: </span>
    <div class="library-tool-row" style="display: flex; width: 80%; align-items: start; margin-top: 10px;">
        <div class="toolName library-tool-input-div">
            <input id="modal_amount_input" type="number" min="0" step="1" pattern="[0-9]*" inputmode="numeric"
                   max="99999999" class="library-tool-input">
        </div>
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn btn_vending" onclick="show('none')" style="margin-right: 20px;">Назад</button>
        <button id="modal_drop_button" class="btn btn_vending upload">Загрузить</button>
    </div>
</div>
<div id="modal_window_confirmation">
    <span style="font-size: 24px;">Вы уверены, что хотите отменить добавление чертежа?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Введённые данные не сохранятся.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn btn_vending"
                onclick="window.location.href='/screen_7_plans.html?token='+localStorage.getItem('token')"
                style="margin-right: 20px;">Назад
        </button>
        <button class="btn btn_vending"
                onclick="window.location.href='/screen_7_plans.html?token='+localStorage.getItem('token')">Отменить
            добавление
        </button>
    </div>
</div>
<div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 40%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

                <div id="loadable_tools_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: visible; display:block;">
                    <table
                            id='loadable_tools_table'
                            data-locale="ru-RU"
                            data-search='true'
                            data-show-refresh='false'
                            data-show-export='true'
                            data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                            data-pagination='true'
                            data-side-pagination='client'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-page-size="210"
                            data-sort-name="number"
                            data-sort-order="asc"
                    >
                        <thead>
                        <tr>
                            <th data-field='name' data-sortable='true'><span
                                    title="Инструмент">Инструмент</span>
                            </th>
                            <th data-field='actions' data-width="50" data-formatter="actionToolsFormatter"><span
                                    title="Информация">Инфо</span></th>
                            <th data-field='sum' data-sortable='true' data-width="100">
                                <span title="В наличии">В наличии</span></th>
                            <th data-field='load' data-sortable='true' data-width="200"
                                data-formatter="sumToolsFormatter">
                                <span title="К загрузке">К загрузке</span></th>
                        </tr>
                        </thead>
                    </table>
                </div>
            </div>
            <div id="column-2" class="d-flex"
                 style="display: flex; flex-direction: column; width: 60%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">
                <div id="qrCodeBlock" style="width: 100%;">
                    <div class="btn-group btn-group-toggle tab-change-bar" data-toggle="buttons" style="margin-top: 10px;">
                        <input type="radio" class="btn-check" name="options-tabs" id="tab1" value="qr"
                               autocomplete="off" checked>
                        <label class="btn btn-outline-tabs btn-lg" for="tab1">Сканирование QR-кода</label>

                        <input type="radio" class="btn-check" name="options-tabs" id="tab2" value="auto"
                               autocomplete="off">
                        <label class="btn btn-outline-tabs btn-lg" for="tab2">Ввести вручную</label>
                    </div>
                    <script>
                        $(document).ready(function() {
                            document.getElementById('qrCodeInput').focus();
                        });

                        $("input[name=options-tabs]").change(function () {
                            console.log(this.value);
                            const elements = document.getElementsByClassName('plan-input');
                            for (elem of elements) {
                                if(this.value == "qr"){
                                    elem.disabled = true;
                                } else {
                                    elem.disabled = false;
                                }
                            }
                            const element = document.getElementById('qrCodeInput');
                            if(this.value == "qr"){
                                element.disabled = false;
                                element.focus();
                            } else {
                                element.disabled = true;
                            }
                        });
                    </script>

                    <div style="padding-bottom: 10px;">
                            <textarea id="qrCodeInput" class="form-control me-2 plan-qr"
                                      placeholder="Отсканируйте QR-код" style="margin-top: 5px;"
                                      onkeydown="fillManualFields(this)"></textarea>
                        <label class="form-check-label" style="padding-top: 5px;"for="qrCodeInput">
                            Первая строка из QR-кода - обозначение чертежа
                        </label>
                    </div>
                </div>
                <div id="manualBlock" class="plan-input-group">
                    <div class="plan-input-row">
                        <span style="width: 100%;">Предприятие:</span>
                        <input id="enterpriseInput" class="form-control plan-input" type="text"
                               placeholder="Завод Контакт" style="margin-top: 5px;" disabled>
                        <span style="width: 100%;">Номер чертежа:</span>
                        <input id="designationInput" class="form-control plan-input" type="text"
                               placeholder="5108-39" disabled>
                    </div>
                    <div class="plan-input-row">
                        <span style="width: 100%;">Название чертежа:</span>
                        <input id="nameInput" class="form-control plan-input" type="text"
                               placeholder="Втулка стальная 5мм." disabled>
                        <span style="width: 100%;">Описание чертежа:</span>
                        <input id="descriptionInput" class="form-control plan-input" type="text"
                               placeholder="Описание чертежа." disabled>
                    </div>

                </div>
                <div class="form-check checkbox-option">
                    <input class="form-check-input" type="checkbox" value="" id="createMassLoad" checked>
                    <label class="form-check-label" for="createMassLoad">
                        Сгенерировать массовую загрузку
                    </label>
                </div>
                <div id="selected_tools_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: auto; display:block;">
                    <table
                            id='selected_tools_table'
                            data-locale="ru-RU"
                            data-show-refresh='false'
                            data-pagination='true'
                            data-side-pagination='client'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-page-size="210"
                            data-toolbar="#customToolsToolbar"
                    >
                        <thead>
                        <tr>
                            <th data-field='name' data-sortable='true'><span
                                    title="Инструмент">Инструмент</span>
                            </th>
                            <th data-field='quantity' data-sortable='true' data-width="100">
                                <span title="В наличии">В наличии</span></th>
                            <th data-field='actions' data-width="100" data-formatter="actionStoryFormatter"><span
                                    title="Действия">Действия</span></th>
                        </tr>
                        </thead>
                    </table>
                    <div id="customToolsToolbar"
                         style="display: flex; align-items: flex-end; align-content: flex-end; flex-wrap: nowrap; flex-direction: row; gap: 10px;">
                        <button class="btn btn_vending" type="button" onclick="clearAllForm()">Очистить все поля
                        </button>
                        <button class="btn btn_vending" type="button" onclick="openModalConf()">Отмена</button>
                        <button id="saveButton" class="btn btn_vending" type="button">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
