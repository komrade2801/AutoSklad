{# templates/nav_btn.html #}

{% macro btn(page, label) -%}
  <button
    id="{{ page|replace('.html','') }}"
    class="btn btn_vending"
    onclick="navigateWithToken('../{{ page }}');"
    type="button"
  >{{ label }}</button>
{%- endmacro %}

{% for page, label in buttons %}
  {{ btn(page, label) }}
{% endfor %}
