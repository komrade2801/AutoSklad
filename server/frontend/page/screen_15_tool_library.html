    <style>
        .droppable {
            border: 1px rgb(255, 255, 255);
            padding: 1px;
            margin: 1px;
            min-height: 50px;
            min-width: 44px;
            text-align: center;
            user-select: none;
        }
  
        .draggable {
          user-select: none;
        }
  
        .btn_vending {
          display: flex;
          justify-content: center;
          align-items: center;
          background: radial-gradient(black, rgb(131,173,239) 1%, rgb(120,158,217) 97%, white), rgb(0,49,114);
          border-color: rgb(255, 255, 255);
          border-radius: 5px;
          color: rgb(0,49,114);
          font-weight: bold;
          font-size: 16px;
          letter-spacing: normal;
          line-height: 1;
          width: 225px;
          height: 35px;
          margin-top: 2px;
        }
  
        .btn_vending_active {
          display: flex;
          justify-content: center;
          align-items: center;
          background: rgb(0,49,114);
          border-color: rgb(80, 130, 179);
          border-radius: 5px;
          color: rgb(199, 224, 249);
          font-weight: bold;
          font-size: 16px;
          letter-spacing: normal;
          line-height: 1;
          width: 225px;
          height: 35px;
          margin-top: 2px;
        }
  
        .search-container {
              position: relative;
              width: 140px;
        }
  
        .search-icon {
            position: absolute;
            top: 50%;
            right: 5px;
            transform: translateY(-50%);
            cursor: pointer;
        }
  
         .suggestions {
             position: absolute;
             top: 35px;
             width: 100%;
             border: 1px solid #ccc;
             border-top: none;
             background: white;
             z-index: 1000;
             border-radius: 0 0 4px 4px;
             max-height: 150px;
             overflow-y: auto;
             display: none;
         }
  
         .suggestions div {
             padding: 5px;
             cursor: pointer;
         }
  
         .suggestions div:hover {
             background-color: #f0f0f0;
         }
  
         .table-actions {
              display: flex;
              justify-content: space-evenly;
              align-items: center;
              align-content: center;
              flex-wrap: wrap;
              flex-direction: row;
          }
  
         .tab-change-bar {
            width: 100%;
            font-size: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            padding: 10px;
         }

        .btn-outline-tabs {
            --bs-btn-color: #ff9923;
            --bs-btn-border-color: #ff9923;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #ff9923;
            --bs-btn-hover-border-color: #ff9923;
            --bs-btn-focus-shadow-rgb: 13, 110, 253;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #ff9923;
            --bs-btn-active-border-color: #ff9923;
            --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
            --bs-btn-disabled-color: #ff9923;
            --bs-btn-disabled-bg: transparent;
            --bs-btn-disabled-border-color: #ff9923;
            --bs-gradient: none;
            font-weight: 600;
        }

        .import-form {
            margin-right: 10px;
            margin-left: 10px;
        }
    </style>
</head>

<body onload="initialization('screen_15_tool_library')"
      class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
<div id="membrane"></div>
<div id="modal_window_confirmation">
    <span style="font-size: 24px;">Вы уверены, что хотите удалить инструмент?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Отменить действие будет невозможно. При необходимости добавьте инструмент в библиотеку заново.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад</button>
        <button class="btn_vending" onclick="show_conf('none')">Удалить</button>
    </div>
</div>
<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3"
         style="width: 100%;height: 100px;margin-top: 10px;margin-left: 0px;">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: center; overflow-y: auto; padding: 10px;">

                <div class="btn-group btn-group-toggle tab-change-bar" data-toggle="buttons">
                    <input type="radio" class="btn-check" name="options-tabs" id="tab1" value="tools" autocomplete="off" checked>
                    <label class="btn btn-outline-tabs btn-lg" for="tab1">Инструменты</label>

                    <input type="radio" class="btn-check" name="options-tabs" id="tab2" value="groups" autocomplete="off">
                    <label class="btn btn-outline-tabs btn-lg" for="tab2">Группы</label>
                </div>
                <script>
                    $("input[name=options-tabs]").change(function () {
                        console.log(this.value);
                        if(this.value == "tools")
                        {
                            changeTab("#tool_library_div", "#group_library_div");
                        } else {
                            changeTab("#group_library_div", "#tool_library_div");
                        }
                    });
                </script>

                <div id="tool_library_div" class="panel-body" style="width: 100%; display:block;">
                    <div class="row">
                        <table
                                id='tool_library_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-columns='true'
                                data-show-refresh='false'
                                data-show-toggle='true'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-row-style='rowStyle'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="50"
                                data-toolbar="#customToolsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='group' data-sortable='true' data-width="20" data-width-unit="%"
                                    data-sorter='dateTimeSorter'><span title="Группа инструмента">Группа</span></th>
                                <th data-field='name' data-sortable='true' data-width="35" data-width-unit="%"><span
                                        title="Наименование инструмента">Номенклатура</span></th>
                                <th data-field='description' data-sortable='true' data-width="35" data-width-unit="%">
                                    <span title="Описание">Описание</span></th>
                                <th data-field='sum' data-sortable='true' data-width="126"><span title="В наличии">В наличии</span>
                                </th>
                                <th data-field='actions' data-width="100" data-formatter="actionToolsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customToolsToolbar" style="display: flex;">
                            <button id="addTool" class="btn btn_vending" type="button"
                                    onclick="window.location.href='./screen_16_add_tool.html?token='+localStorage.getItem('token');">
                                Добавить инструмент
                            </button>
                            <form id="importToolsForm" action="javascript:;" onsubmit="doImportTools(this) "
                                  style="display: flex; align-items: center; margin-left: 20px;">
                                <button id="importTools" type="submit" class="btn_vending">Загрузить xlsx</button>
                                <input class="import-form" id="importToolsFile" type="file" name="file" accept=".xlsx" required/>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="useToolCount">
                                    <label class="form-check-label" for="useToolCount">
                                        Учитывать количество
                                    </label>
                                </div>
                            </form>
                        </div>
                        <script>
                            function actionToolsFormatter(value, row, index, field) {
                            //    console.log(value);
                            //    console.log(row);
                            //    console.log(index);
                            //    console.log(field);
        
                                 let actionsDiv = document.createElement("div");
                                 actionsDiv.className = "table-actions";
        
                                 // Edit button
                            //     let editCell = document.createElement("td");
                                 let editButton = document.createElement("button");
                                 editButton.style.width = "35px";
                                 editButton.style.height = "35px";
                                 editButton.innerHTML = "✏️";
                                 editButton.title = "Редактировать";
        
                                 editButton.addEventListener('click', function () {
                                     console.log("Редактировать - Клик был: " + index);
                                 });
        
                                 actionsDiv.appendChild(editButton);
        
                                 // Delete button
                            //     let deleteCell = document.createElement("td");
                                 let deleteButton = document.createElement("button");
                                 deleteButton.style.width = "35px";
                                 deleteButton.style.height = "35px";
                                 deleteButton.innerHTML = "❌";
                                 deleteButton.title = "Удалить";
        
                                 deleteButton.addEventListener('click', function () {
                                     console.log("Удалить - Клик был: " + index);
                                 });
        
                                 actionsDiv.appendChild(deleteButton);
        
                                 return actionsDiv;
                            }
                        </script>
                    </div>
                </div>
                <div id="group_library_div" class="panel-body" style="width: 100%; display:none;">
                    <div class="row">
                        <table
                                id='group_library_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-columns='true'
                                data-show-refresh='false'
                                data-show-toggle='true'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-row-style='rowStyle'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="50"
                                data-toolbar="#customGroupsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='group' data-width="20" data-width-unit="%" data-sortable='true'
                                    data-sorter='dateTimeSorter'><span title="Группа">Группа</span></th>
                                <th data-field='parent_group' data-width="20" data-width-unit="%" data-sortable='true'>
                                    <span title="Родительская группа">Родительская группа</span></th>
                                <th data-field='description' data-width="30" data-width-unit="%" data-sortable='true'>
                                    <span title="Описание">Описание</span></th>
                                <th data-field='full' data-sortable='true' data-width="20" data-width-unit="%"><span
                                        title="Полное обозначение">Полное обозначение</span></th>
                                <th data-field='actions' data-width="100" data-formatter="actionGroupsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customGroupsToolbar">
                            <button id="addGroup" class="btn btn_vending" type="button"
                                    onclick="window.location.href='./screen_23_add_group.html?token='+localStorage.getItem('token');">
                                Добавить группу
                            </button>
                        </div>
                        <script>
                            function actionGroupsFormatter(value, row, index, field) {
                            //    console.log(value);
                            //    console.log(row);
                            //    console.log(index);
                            //    console.log(field);
        
                                 let actionsDiv = document.createElement("div");
                                 actionsDiv.className = "table-actions";
        
                                 // Edit button
                            //     let editCell = document.createElement("td");
                                 let editButton = document.createElement("button");
                                 editButton.style.width = "35px";
                                 editButton.style.height = "35px";
                                 editButton.innerHTML = "✏️";
                                 editButton.title = "Редактировать";
        
                                 editButton.addEventListener('click', function () {
                                     console.log("Редактировать - Клик был: " + index);
                                 });
        
                                 actionsDiv.appendChild(editButton);
        
                                 // Delete button
                            //     let deleteCell = document.createElement("td");
                                 let deleteButton = document.createElement("button");
                                 deleteButton.style.width = "35px";
                                 deleteButton.style.height = "35px";
                                 deleteButton.innerHTML = "❌";
                                 deleteButton.title = "Удалить";
        
                                 deleteButton.addEventListener('click', function () {
                                     console.log("Удалить - Клик был: " + index);
                                 });
        
                                 actionsDiv.appendChild(deleteButton);
        
                                 return actionsDiv;
                            }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
