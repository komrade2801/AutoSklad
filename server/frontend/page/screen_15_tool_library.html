<body onload="initialization('screen_15_tool_library')"
      class="d-flex justify-content-center" id="body">
<div id="membrane"></div>
<div id="modal_window_confirmation">
    <span style="font-size: 24px;">Вы уверены, что хотите удалить инструмент?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Отменить действие будет невозможно. При необходимости добавьте инструмент в библиотеку заново.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад</button>
        <button class="btn btn_vending" onclick="show_conf('none')">Удалить</button>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex" id="v-pills-page_15_mass_load"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: center; overflow-y: auto; padding: 10px;">

                <div class="btn-group btn-group-toggle tab-change-bar" data-toggle="buttons" style="width: 100%;">
                    <input type="radio" class="btn-check" name="options-tabs" id="tab1" value="tools" autocomplete="off"
                           checked>
                    <label class="btn btn-outline-tabs btn-lg" for="tab1">Инструменты</label>

                    <input type="radio" class="btn-check" name="options-tabs" id="tab2" value="groups"
                           autocomplete="off">
                    <label class="btn btn-outline-tabs btn-lg" for="tab2">Группы</label>
                </div>
                <script>
                    $("input[name=options-tabs]").change(function () {
                        console.log(this.value);
                        // Сохраняем выбранную вкладку в localStorage
                        localStorage.setItem('toolLibraryActiveTab', this.value);
                        if(this.value == "tools")
                        {
                            if (typeof window.changeTab === 'function') {
                                window.changeTab("#tool_library_div", "#group_library_div");
                            }
                        } else {
                            if (typeof window.changeTab === 'function') {
                                window.changeTab("#group_library_div", "#tool_library_div");
                            }
                        }
                    });
                </script>

                <div id="tool_library_div" class="panel-body" style="width: 100%; display:block;">
                    <div class="row">
                        <table
                                id='tool_library_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-columns='true'
                                data-show-refresh='false'
                                data-show-toggle='true'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="50"
                                data-toolbar="#customToolsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='group' data-sortable='true' data-width="20" data-width-unit="%"
                                    data-sorter='dateTimeSorter'><span title="Группа инструмента">Группа</span></th>
                                <th data-field='name' data-sortable='true' data-width="35" data-width-unit="%"><span
                                        title="Наименование инструмента">Номенклатура</span></th>
                                <th data-field='description' data-sortable='true' data-width="35" data-width-unit="%">
                                    <span title="Описание">Описание</span></th>
                                <th data-field='sum' data-sortable='true' data-width="126"><span title="В наличии">В наличии</span>
                                </th>
                                <th data-field='actions' data-width="100" data-formatter="actionToolsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customToolsToolbar" style="display: flex; align-items: center;">
                            <button id="addTool" class="btn btn_vending" type="button"
                                    onclick="window.location.href='./screen_16_add_tool.html?token='+localStorage.getItem('token');">
                                Добавить инструмент
                            </button>
                            <form id="importToolsForm" action="javascript:;" onsubmit="doImportTools(this) "
                                  style="display: flex; align-items: center; margin-left: 20px;">
                                <button id="importTools" type="submit" class="btn btn_vending" style="width:180px">Загрузить xlsx</button>
                                <input class="import-form" id="importToolsFile" type="file" name="file" accept=".xlsx"
                                       required/>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="useToolCount">
                                    <label class="form-check-label" for="useToolCount" style="width:200px">
                                        Учитывать количество
                                    </label>
                                </div>
                            </form>
                        </div>
                        <script>
                            function actionToolsFormatter(value, row, index, field) {
                            //    console.log(value);
                            //    console.log(row);
                            //    console.log(index);
                            //    console.log(field);
        
                                 let actionsDiv = document.createElement("div");
                                 actionsDiv.className = "table-actions";
        
                                 // Edit button
                            //     let editCell = document.createElement("td");
                                 let editButton = document.createElement("button");
                                 editButton.style.width = "35px";
                                 editButton.style.height = "35px";
                                 editButton.innerHTML = "✏️";
                                 editButton.title = "Редактировать";
        
                                 editButton.addEventListener('click', async function () {
                                     const toolTypeId = row.id;
                                     if (!toolTypeId) {
                                         console.error("ID инструмента не найден");
                                         return;
                                     }
                                     
                                     // Проверяем, занят ли инструмент
                                     try {
                                         const checkResponse = await fetch(`../backend/check_tool_busy/${toolTypeId}`);
                                         if (!checkResponse.ok) {
                                             throw new Error("Ошибка проверки инструмента");
                                         }
                                         const checkData = await checkResponse.json();
                                         
                                         if (checkData.is_busy) {
                                             alert("Данный инструмент используется в вендинге.\nРедактировать можно только свободный инструмент.\n" + checkData.message);
                                             return;
                                         }
                                         
                                         // Переходим на страницу редактирования с параметром tool_type_id
                                         let url = '../screen_16_add_tool.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token + "&tool_type_id=" + toolTypeId;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при проверке инструмента:', error);
                                         alert('Ошибка при проверке инструмента');
                                     }
                                 });
        
                                 actionsDiv.appendChild(editButton);
        
                                 // Delete button
                            //     let deleteCell = document.createElement("td");
                                 let deleteButton = document.createElement("button");
                                 deleteButton.style.width = "35px";
                                 deleteButton.style.height = "35px";
                                 deleteButton.innerHTML = "❌";
                                 deleteButton.title = "Удалить";
        
                                 deleteButton.addEventListener('click', async function () {
                                     const toolTypeId = row.id;
                                     if (!toolTypeId) {
                                         console.error("ID инструмента не найден");
                                         return;
                                     }
                                     
                                     // Подтверждение удаления
                                     if (!confirm("Вы уверены, что хотите удалить этот инструмент?")) {
                                         return;
                                     }
                                     
                                     // Удаляем инструмент (endpoint сам проверит занятость)
                                     try {
                                         const deleteResponse = await fetch(`../backend/delete_tool_type/${toolTypeId}`, {
                                             method: 'DELETE'
                                         });
                                         
                                         if (!deleteResponse.ok) {
                                             const errorData = await deleteResponse.json();
                                             alert(errorData.detail || "Ошибка при удалении инструмента");
                                             return;
                                         }
                                         
                                         const result = await deleteResponse.json();
                                         alert(result.message || "Инструмент успешно удален");
                                         
                                         // Перезагружаем страницу для обновления таблицы
                                         let url = '../screen_15_tool_library.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при удалении инструмента:', error);
                                         alert('Ошибка при удалении инструмента');
                                     }
                                 });
        
                                 actionsDiv.appendChild(deleteButton);
        
                                 return actionsDiv;
                            }
                        </script>
                    </div>
                </div>
                <div id="group_library_div" class="panel-body" style="width: 100%; display:none;">
                    <div class="row">
                        <table
                                id='group_library_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-columns='true'
                                data-show-refresh='false'
                                data-show-toggle='true'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="50"
                                data-toolbar="#customGroupsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='group' data-width="20" data-width-unit="%" data-sortable='true'
                                    data-sorter='dateTimeSorter'><span title="Группа">Группа</span></th>
                                <th data-field='parent_group' data-width="20" data-width-unit="%" data-sortable='true'>
                                    <span title="Родительская группа">Родительская группа</span></th>
                                <th data-field='description' data-width="30" data-width-unit="%" data-sortable='true'>
                                    <span title="Описание">Описание</span></th>
                                <th data-field='full' data-sortable='true' data-width="20" data-width-unit="%"><span
                                        title="Полное обозначение">Полное обозначение</span></th>
                                <th data-field='actions' data-width="100" data-formatter="actionGroupsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customGroupsToolbar">
                            <button id="addGroup" class="btn btn_vending" type="button"
                                    onclick="window.location.href='./screen_23_add_group.html?token='+localStorage.getItem('token');">
                                Добавить группу
                            </button>
                        </div>
                        <script>
                            function actionGroupsFormatter(value, row, index, field) {
                            //    console.log(value);
                            //    console.log(row);
                            //    console.log(index);
                            //    console.log(field);
        
                                 let actionsDiv = document.createElement("div");
                                 actionsDiv.className = "table-actions";
        
                                 // Edit button
                            //     let editCell = document.createElement("td");
                                 let editButton = document.createElement("button");
                                 editButton.style.width = "35px";
                                 editButton.style.height = "35px";
                                 editButton.innerHTML = "✏️";
                                 editButton.title = "Редактировать";
        
                                 editButton.addEventListener('click', async function () {
                                     const groupId = row.id;
                                     if (!groupId) {
                                         console.error("ID группы не найден");
                                         return;
                                     }
                                     
                                     // Проверяем, занята ли группа
                                     try {
                                         const checkResponse = await fetch(`../backend/check_group_busy/${groupId}`);
                                         if (!checkResponse.ok) {
                                             throw new Error("Ошибка проверки группы");
                                         }
                                         const checkData = await checkResponse.json();
                                         
                                         if (checkData.is_busy) {
                                             alert("Данный инструмент используется в вендинге.\nРедактировать можно только свободный инструмент.");
                                             return;
                                         }
                                         
                                         // Переходим на страницу редактирования с параметром group_id
                                         let url = '../screen_23_add_group.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token + "&group_id=" + groupId;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при проверке группы:', error);
                                         alert('Ошибка при проверке группы');
                                     }
                                 });
        
                                 actionsDiv.appendChild(editButton);
        
                                 // Delete button
                            //     let deleteCell = document.createElement("td");
                                 let deleteButton = document.createElement("button");
                                 deleteButton.style.width = "35px";
                                 deleteButton.style.height = "35px";
                                 deleteButton.innerHTML = "❌";
                                 deleteButton.title = "Удалить";
        
                                 deleteButton.addEventListener('click', async function () {
                                     const groupId = row.id;
                                     if (!groupId) {
                                         console.error("ID группы не найден");
                                         return;
                                     }
                                     
                                     // Подтверждение удаления
                                     if (!confirm("Вы уверены, что хотите удалить эту группу?")) {
                                         return;
                                     }
                                     
                                     // Удаляем группу (endpoint сам проверит занятость)
                                     try {
                                         const deleteResponse = await fetch(`../backend/delete_group/${groupId}`, {
                                             method: 'DELETE'
                                         });
                                         
                                         if (!deleteResponse.ok) {
                                             const errorData = await deleteResponse.json();
                                             alert(errorData.detail || "Ошибка при удалении группы");
                                             return;
                                         }
                                         
                                         const result = await deleteResponse.json();
                                         alert(result.message || "Группа успешно удалена");
                                         
                                         // Перезагружаем страницу для обновления таблицы
                                         let url = '../screen_15_tool_library.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при удалении группы:', error);
                                         alert('Ошибка при удалении группы');
                                     }
                                 });
        
                                 actionsDiv.appendChild(deleteButton);
        
                                 return actionsDiv;
                            }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
