<div class="progress-container">
    <div class="progress-bar">
        <div class="progress-fill" :style="{width: progressPercentage + '%'}"></div>
    </div>
    <div class="progress-text">
        {{ currentStage }} ({{ progressPercentage }}%)
    </div>
    <div class="progress-messages">
        <div v-for="msg in messages" :key="msg">{{ msg }}</div>
    </div>
    <button @click="startDbSetup" :disabled="isProcessing">
        {{ isProcessing ? 'Выполняется...' : 'Запустить инициализацию БД' }}
    </button>
</div>

<script>
new Vue({
    el: '.progress-container',
    data: {
        progressPercentage: 0,
        currentStage: '',
        messages: [],
        isProcessing: false
    },
    methods: {
        async fetchProgress() {
            try {
                const response = await fetch('/api/db-setup/progress');
                const data = await response.json();

                this.progressPercentage = data.percentage;
                this.currentStage = data.current_stage;
                this.messages = data.messages;
                this.isProcessing = data.status === 'in_progress';

                if (data.status === 'in_progress') {
                    setTimeout(this.fetchProgress, 1000);
                }
            } catch (error) {
                console.error('Ошибка получения прогресса:', error);
            }
        },
        async startDbSetup() {
            this.isProcessing = true;
            await fetch('/api/db-setup/start', { method: 'POST' });
            this.fetchProgress();
        }
    },
    mounted() {
        this.fetchProgress();
    }
});
</script>

<style>
.progress-bar {
    width: 100%;
    height: 20px;
    background-color: #eee;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background-color: #4CAF50;
    transition: width 0.3s ease;
}

.progress-text {
    margin: 10px 0;
    font-weight: bold;
}

.progress-messages {
    height: 100px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 10px;
    margin: 10px 0;
}
</style>
