<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="icon" href="/favicon.png?v=1" type="image/png">
    <title>Все чертежи</title>
    <script type="module" src="../scripts/plans/init_7_plans.js"></script>
    <script src="../scripts/authorisation/navigate_token.js"></script>
    <!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->
    <link rel="stylesheet" href="../assets/bootstrap-icons/1.13.1/bootstrap-icons.css">
    <link href="../assets/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">
    <script src="../assets/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/bootstrap-table.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/locale/bootstrap-table-ru-RU.js"></script>

    <link rel="stylesheet" href="../assets/jquery-resizable-columns/jquery.resizableColumns.css">
    <script src="../assets/jquery-resizable-columns/jquery.resizableColumns.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/resizable/bootstrap-table-resizable.js"></script>

    <script src="../assets/tableExport.jquery.plugin/tableExport.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/js-xlsx/xlsx.core.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/pdfmake.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/vfs_fonts.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/export/bootstrap-table-export.js"></script>

    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
</head>
<body onload="initialization('screen_7_plans')"
      class="d-flex justify-content-center" id="body">

<div id="membrane"></div>
<div id="modal_window_tool">
    <span class="plan_name" style="width: 80%; align-items: start; margin-top: 10px;">Чертёж №: <span
            id="modal_plan_tools_id"></span></span>
    <div id="tool_list">
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
        <button class="btn_vending" onclick="showTool('none')" style="margin-right: 20px;">Назад</button>
    </div>
</div>

<!-- Разметка модалки -->
<div id="modal_window_barcode" class="modal-overlay">
    <span class="plan_name">Чертёж №: <span id="modal_plan_id"></span></span>
    <img
            id="modal_barcode_img"
            class="barcode-img"
            src=""
            alt="Plan barcode"
    />
    <div class="modal-actions">
        <button class="btn_vending" onclick="showBarcode('none')">Назад</button>
        <button class="btn_vending" onclick="printBarcode()">Распечатать</button>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: center; overflow-y: auto; padding: 0 10px 10px 10px;">

                <div id="plans_div" class="panel-body" style="width: 100%; display:block;">
                    <div class="row">
                        <table
                                id='plans_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-columns='true'
                                data-show-refresh='false'
                                data-show-toggle='true'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-row-style='rowStyle'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="50"
                                data-toolbar="#customToolsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='barcode' data-sortable='true' data-width="20" data-width-unit="%">
                                    <span title="Штрихкод">Штрихкод</span></th>
                                <th data-field='designation' data-sortable='true' data-width="126"><span
                                        title="Обозначение">Обозначение</span>
                                </th>
                                <th data-field='name' data-sortable='true' data-width="126"><span title="Наименование">Наименование</span>
                                </th>
                                <th data-field='enterprise' data-sortable='true' data-width="35"
                                    data-width-unit="%"><span
                                        title="Предприятие">Предприятие</span></th>
                                <th data-field='description' data-sortable='true' data-width="35" data-width-unit="%">
                                    <span title="Описание">Описание</span></th>
                                <th data-field='toolList' data-width="100" data-formatter="toolListFormatter"><span
                                        title="Список инструментов">Список инструментов</span></th>
                                <th data-field='actions' data-width="100" data-formatter="actionToolsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customToolsToolbar" style="display: flex;">
                            <button id="addPlanButton" class="btn btn_vending" type="button" style="padding-right: 30px; padding-left: 30px;" onclick="window.location.href='./screen_8_append_plan.html?token='+localStorage.getItem('token');">
                                Добавить чертёж
                            </button>
                        </div>
                        <script>
                            // Функция для открытия модального окна
                            function openPlanToolListModal(plan_name, plan_tools) {
                                // Подставляем ID в текст
                                document.getElementById('modal_plan_tools_id').textContent = plan_name;

                                let tool_list_element = document.getElementById('tool_list');
                                tool_list_element.innerHTML = '';

                                plan_tools.forEach(tool => {
                                    const tool_row = document.createElement('div');
                                    tool_row.style = 'padding-top: 20px;'
                                    tool_row.innerHTML = tool.name + '\t-\t' + tool.tool_types_count + ' шт.';
                                    tool_list_element.appendChild(tool_row);
                                })

                                showTool('flex');  // Открываем модальное окно
                            }

                            function toolListFormatter(value, row, index, field) {
                                let toolListActionDiv = document.createElement("div");
                                 toolListActionDiv.className = "table-actions";

                                 let toolListButton = document.createElement("button");
                                 toolListButton.style.width = "35px";
                                 toolListButton.style.height = "35px";
                                 toolListButton.innerHTML = "📋";
                                 toolListButton.title = "Показать список инструментов";

                                 toolListButton.addEventListener('click', async function() {openPlanToolListModal(row.designation, row.tools)});

                                 toolListActionDiv.appendChild(toolListButton);

                                 return toolListActionDiv;
                            }

                            function actionToolsFormatter(value, row, index, field) {
                            //    console.log(value);
                            //    console.log(row);
                            //    console.log(index);
                            //    console.log(field);

                                 let actionsDiv = document.createElement("div");
                                 actionsDiv.className = "table-actions";

                                 // Edit button
                            //     let editCell = document.createElement("td");
                                 let editButton = document.createElement("button");
                                 editButton.style.width = "35px";
                                 editButton.style.height = "35px";
                                 editButton.innerHTML = "✏️";
                                 editButton.title = "Редактировать";

                                 editButton.addEventListener('click', async function () {
                                     const toolTypeId = row.id;
                                     if (!toolTypeId) {
                                         console.error("ID инструмента не найден");
                                         return;
                                     }

                                     // Проверяем, занят ли инструмент
                                     try {
                                         const checkResponse = await fetch(`../backend/check_tool_busy/${toolTypeId}`);
                                         if (!checkResponse.ok) {
                                             throw new Error("Ошибка проверки инструмента");
                                         }
                                         const checkData = await checkResponse.json();

                                         if (checkData.is_busy) {
                                             alert("Данный инструмент используется в вендинге.\nРедактировать можно только свободный инструмент.\n" + checkData.message);
                                             return;
                                         }

                                         // Переходим на страницу редактирования с параметром tool_type_id
                                         let url = '../screen_16_add_tool.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token + "&tool_type_id=" + toolTypeId;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при проверке инструмента:', error);
                                         alert('Ошибка при проверке инструмента');
                                     }
                                 });

                                 actionsDiv.appendChild(editButton);

                                 // Delete button
                            //     let deleteCell = document.createElement("td");
                                 let deleteButton = document.createElement("button");
                                 deleteButton.style.width = "35px";
                                 deleteButton.style.height = "35px";
                                 deleteButton.innerHTML = "❌";
                                 deleteButton.title = "Удалить";

                                 deleteButton.addEventListener('click', async function () {
                                     const toolTypeId = row.id;
                                     if (!toolTypeId) {
                                         console.error("ID инструмента не найден");
                                         return;
                                     }

                                     // Подтверждение удаления
                                     if (!confirm("Вы уверены, что хотите удалить этот инструмент?")) {
                                         return;
                                     }

                                     // Удаляем инструмент (endpoint сам проверит занятость)
                                     try {
                                         const deleteResponse = await fetch(`../backend/delete_tool_type/${toolTypeId}`, {
                                             method: 'DELETE'
                                         });

                                         if (!deleteResponse.ok) {
                                             const errorData = await deleteResponse.json();
                                             alert(errorData.detail || "Ошибка при удалении инструмента");
                                             return;
                                         }

                                         const result = await deleteResponse.json();
                                         alert(result.message || "Инструмент успешно удален");

                                         // Перезагружаем страницу для обновления таблицы
                                         let url = '../screen_15_tool_library.html';
                                         let targetUrl = new URL(url, window.location.origin).href;
                                         let token = localStorage.getItem('token');
                                         let full_url = targetUrl + "?token=" + token;
                                         window.location.href = full_url;
                                     } catch (error) {
                                         console.error('Ошибка при удалении инструмента:', error);
                                         alert('Ошибка при удалении инструмента');
                                     }
                                 });

                                 actionsDiv.appendChild(deleteButton);

                                 return actionsDiv;
                            }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
