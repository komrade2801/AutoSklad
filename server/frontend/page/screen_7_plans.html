<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="icon" href="/favicon.png?v=1" type="image/png">
    <title>Все чертежи</title>
    <script type="module" src="../scripts/plans/init_7_plans.js"></script>
    <script src="../scripts/plans/tableScript.js"></script>
    <script src="../scripts/authorisation/navigate_token.js"></script>
    <!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->
    <link rel="stylesheet" href="../assets/bootstrap-icons/1.13.1/bootstrap-icons.css">
    <link href="../assets/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">
    <script src="../assets/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/bootstrap-table.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/locale/bootstrap-table-ru-RU.js"></script>

    <!--    <link rel="stylesheet" href="../assets/jquery-resizable-columns/jquery.resizableColumns.css">-->
    <!--    <script src="../assets/jquery-resizable-columns/jquery.resizableColumns.js"></script>-->
    <!--    <script src="../assets/bootstrap-table/1.25.0/extensions/resizable/bootstrap-table-resizable.js"></script>-->

    <script src="../assets/tableExport.jquery.plugin/tableExport.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/js-xlsx/xlsx.core.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/pdfmake.min.js"></script>
    <script src="../assets/tableExport.jquery.plugin/libs/pdfmake/vfs_fonts.js"></script>
    <script src="../assets/bootstrap-table/1.25.0/extensions/export/bootstrap-table-export.js"></script>

    <script src="../scripts/authorisation/navigate_token.js"></script>
    <!--    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">-->
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
</head>
<body onload="initialization('screen_7_plans')"
      class="d-flex justify-content-center" id="body">

<!-- Модальное окно списка инструментов -->
<div class="modal fade modal-dialog-scrollable vending-modal-window" id="modal_window_tool" tabindex="-1"
     aria-labelledby="modalToolListLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div class="modal-header-icon">
                        <i class="bi bi-tools" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="modalToolListLabel">Чертёж №: <span id="modal_plan_tools_id"></span>
                        </h5>
                        <p style="margin: 0; margin-top: 4px;">Список инструментов для данного чертежа</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="showToolModal(false)"
                        aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div id="random_plan_div" class="panel-body"
                     style="width: 100%; height: 100%; overflow-y: visible; display:block;">
                    <table
                            id='random_plan_table'
                            data-locale="ru-RU"
                            data-pagination='false'
                    >
                        <thead>
                        <tr>
                            <th data-field='name' data-sortable='true'>
                                <span title="Инструмент">Инструмент</span></th>
                            <th data-field='tool_types_count'>
                                <span title="Количество">Количество</span></th>
                        </tr>
                        </thead>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Назад</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно штрихкода -->
<div class="modal fade modal-dialog-scrollable vending-modal-window" id="modal_window_barcode" tabindex="-1"
     aria-labelledby="modalBarcodeLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div class="modal-header-icon">
                        <i class="bi bi-qr-code" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="modalBarcodeLabel">Чертёж №: <span id="modal_plan_id"></span></h5>
                        <p style="margin: 0; margin-top: 4px;">Штрихкод чертежа</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="showBarcodeModal(false)"
                        aria-label="Закрыть"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal_barcode_img" class="qrcode-img" src="" alt="Plan barcode">
                <p id="modal_barcode_plan_title" class="qrcode-label">Штрихкод чертежа</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="showBarcodeModal(false)">Назад</button>
                <button type="button" class="btn btn-primary" onclick="printBarcode()">Распечатать
                </button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="printArea" style="display:none;"></div>
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

                <div id="plans_div" class="panel-body"
                     style="width: 100%; height: 100%; display:block;">
                    <table
                            id='plans_table'
                            data-locale="ru-RU"
                            data-resizable='true'
                            data-search='true'
                            data-show-refresh='false'
                            data-show-export='true'
                            data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                            data-pagination='true'
                            data-side-pagination='client'
                            data-row-style='rowStyle'
                            data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                            data-page-size="25"
                            data-toolbar="#customToolsToolbar"
                    >
                        <thead>
                        <tr>
                            <th data-field='designation' data-sortable='true'><span
                                    title="Обозначение">Обозначение</span>
                            </th>
                            <th data-field='name' data-sortable='true'><span title="Наименование">Наименование</span>
                            </th>
                            <th data-field='enterprise' data-sortable='true'><span
                                    title="Предприятие">Предприятие</span></th>
                            <th data-field='description' data-sortable='true'>
                                <span title="Описание">Описание</span></th>
                            <th data-field='actions' data-width="200" data-formatter="actionToolsFormatter"><span
                                    title="Действия">Действия</span></th>
                        </tr>
                        </thead>
                    </table>
                    <div id="customToolsToolbar" class="custom-toolbar-content" style="display: flex;">
                        <button id="addPlanButton" class="btn btn_vending" type="button"
                                style="padding-right: 30px; padding-left: 30px;"
                                onclick="window.location.href='./screen_8_append_plan.html?token='+localStorage.getItem('token');">
                            Добавить чертёж
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно подтверждения удаления -->
        <div class="modal fade modal-dialog-scrollable vending-modal-window" id="deleteConfirmModal" tabindex="-1"
             aria-labelledby="deleteConfirmModalLabel" aria-hidden="true" data-bs-backdrop="true"
             data-bs-keyboard="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <div style="display: flex; align-items: center; width: 100%;">
                            <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                                <i class="bi bi-exclamation-triangle-fill" style="color: white; font-size: 24px;"></i>
                            </div>
                            <div style="flex: 1;">
                                <h5 class="modal-title" id="deleteConfirmModalLabel"
                                    style="margin: 0; font-size: 1.25rem; font-weight: 600;">Подтверждение удаления</h5>
                                <p id="deleteConfirmMessage"
                                   style="margin: 0; margin-top: 4px; font-size: 1rem; color: rgba(255,255,255,0.9); line-height: 1.4; font-weight: 400;">
                                    Вы уверены, что хотите выполнить это действие?</p>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelDeleteBtn">
                            Отмена
                        </button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
