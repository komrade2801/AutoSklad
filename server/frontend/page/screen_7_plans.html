    <script src="../assets/jquery/2.1.0/jquery.min.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap-table/1.25.0/bootstrap-table.css">

    <script src="../scripts/authorisation/navigate_token.js"></script>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <style>
        /* Модалки списка инструментов и штрихкода — по образцу screen_15 */
        #modal_window_tool,
        #modal_window_barcode {
            padding: 0;
        }

        #modal_window_tool .modal-dialog,
        #modal_window_barcode .modal-dialog {
            max-width: 550px;
        }

        #modal_window_tool .modal-content,
        #modal_window_barcode .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            background: #fff;
            overflow: hidden;
        }

        #modal_window_tool .modal-header,
        #modal_window_barcode .modal-header {
            width: 100%;
            box-sizing: border-box;
            border-radius: 16px 16px 0 0;
            border-bottom: none;
            padding: 16px 20px;
            background: #4e9be5;
            color: white;
        }

        #modal_window_tool .modal-title,
        #modal_window_barcode .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            margin: 0;
        }

        #modal_window_tool .modal-header p,
        #modal_window_barcode .modal-header p {
            font-weight: 400;
            margin: 0;
            margin-top: 4px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        #modal_window_tool .modal-body,
        #modal_window_barcode .modal-body {
            background: #fff;
            padding: 16px 20px;
        }

        #modal_window_tool .modal-footer,
        #modal_window_barcode .modal-footer {
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 0 0 16px 16px;
            justify-content: center;
        }

        #modal_window_tool .btn-close,
        #modal_window_barcode .btn-close {
            filter: invert(1);
            opacity: 0.8;
            flex-shrink: 0;
        }

        #modal_window_tool .btn-close:hover,
        #modal_window_barcode .btn-close:hover {
            opacity: 1;
        }

        #modal_window_tool .modal.fade .modal-dialog,
        #modal_window_barcode .modal.fade .modal-dialog {
            transition: transform 0.3s ease-out;
            transform: translate(0, -50px);
        }

        #modal_window_tool .modal.show .modal-dialog,
        #modal_window_barcode .modal.show .modal-dialog {
            transform: translate(0, 0);
        }

        /* Модальное окно подтверждения удаления — собственное, по образцу screen_15 */
        #deleteConfirmModal .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            background: white;
            overflow: hidden;
        }

        #deleteConfirmModal .modal-dialog {
            max-width: 500px;
        }

        #deleteConfirmModal .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: none;
            padding: 24px;
            border-radius: 16px 16px 0 0;
        }

        #deleteConfirmModal .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
            margin: 0;
        }

        #deleteConfirmModal #deleteConfirmMessage {
            font-weight: 400;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }

        #deleteConfirmModal .btn-close {
            filter: invert(1);
            opacity: 0.8;
            flex-shrink: 0;
        }

        #deleteConfirmModal .btn-close:hover {
            opacity: 1;
        }

        #deleteConfirmModal .modal-footer {
            border-top: 1px solid #e9ecef;
            padding: 20px 24px;
            background: #f8f9fa;
            border-radius: 0 0 16px 16px;
            gap: 5px;
            justify-content: center;
        }

        #deleteConfirmModal .btn {
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
            font-size: 0.95rem;
            min-width: 100px;
            transition: all 0.2s ease;
        }

        #deleteConfirmModal .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            color: white;
        }

        #deleteConfirmModal .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #5a6268;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #deleteConfirmModal .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            border: none;
            color: white;
        }

        #deleteConfirmModal .btn-danger:hover {
            background: linear-gradient(135deg, #ee5a52 0%, #dc4545 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 107, 107, 0.3);
        }

        #deleteConfirmModal .modal.fade .modal-dialog {
            transition: transform 0.3s ease-out;
            transform: translate(0, -50px);
        }

        #deleteConfirmModal .modal.show .modal-dialog {
            transform: translate(0, 0);
        }

        /* Видимая полоса прокрутки в модалках при переполнении */
        .modal-dialog-scrollable .modal-body {
            scrollbar-width: auto;
            scrollbar-gutter: stable;
        }
        .modal-dialog-scrollable .modal-body::-webkit-scrollbar {
            width: 10px;
        }
        .modal-dialog-scrollable .modal-body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        .modal-dialog-scrollable .modal-body::-webkit-scrollbar-thumb {
            background: #adb5bd;
            border-radius: 5px;
        }
        .modal-dialog-scrollable .modal-body::-webkit-scrollbar-thumb:hover {
            background: #6c757d;
        }
    </style>
</head>
<body onload="initialization('screen_7_plans')"
      class="d-flex justify-content-center" id="body">

<!-- Модальное окно списка инструментов -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_tool" tabindex="-1" aria-labelledby="modalToolListLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-tools" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="modalToolListLabel">Чертёж №: <span id="modal_plan_tools_id"></span></h5>
                        <p style="margin: 0; margin-top: 4px;">Список инструментов для данного чертежа</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="showToolModal(false)" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div id="tool_list"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="showToolModal(false)">Назад</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно штрихкода -->
<div class="modal fade modal-dialog-scrollable" id="modal_window_barcode" tabindex="-1" aria-labelledby="modalBarcodeLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                        <i class="bi bi-qr-code" style="color: white; font-size: 24px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h5 class="modal-title" id="modalBarcodeLabel">Чертёж №: <span id="modal_plan_id"></span></h5>
                        <p style="margin: 0; margin-top: 4px;">Штрихкод чертежа</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="showBarcodeModal(false)" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal_barcode_img" class="barcode-img" src="" alt="Plan barcode" style="max-height: 200px; border-radius: 5px; margin: 10px 0;">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="showBarcodeModal(false)">Назад</button>
                <button type="button" class="btn btn-primary" onclick="printBarcode()" style="background-color: #4e9be5; border-color: #4e9be5;">Распечатать</button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex flex-column"
     style="height: 100%; width: 100%; position: static; margin-left: 0px;">
    <nav id="navbar"
         class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
        <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical"
             style="width: 235px; padding-left: 10px; margin-top: 10px;">
        </div>
        <div class="tab-pane fade show active d-flex"
             style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
            <div id="printArea" style="display:none;"></div>
            <div id="column-1" class="d-flex"
                 style="flex-direction: column; width: 100%; height: 100%; align-items: start; overflow: hidden; padding: 0 10px 10px 10px;">

                <div id="plans_div" class="panel-body"
                     style="width: 100%; height: 100%; display:block;">
                        <table
                                id='plans_table'
                                data-locale="ru-RU"
                                data-resizable='true'
                                data-search='true'
                                data-show-refresh='false'
                                data-show-export='true'
                                data-export-types="['json', 'csv', 'xlsx', 'pdf']"
                                data-pagination='true'
                                data-side-pagination='client'
                                data-row-style='rowStyle'
                                data-page-list="[10, 25, 50, 100, 200, 500, 1000]"
                                data-page-size="25"
                                data-toolbar="#customToolsToolbar"
                        >
                            <thead>
                            <tr>
                                <th data-field='barcode' data-sortable='true' data-width="20" data-width-unit="%">
                                    <span title="Штрихкод">Штрихкод</span></th>
                                <th data-field='designation' data-sortable='true' data-width="126"><span
                                        title="Обозначение">Обозначение</span>
                                </th>
                                <th data-field='name' data-sortable='true' data-width="126"><span title="Наименование">Наименование</span>
                                </th>
                                <th data-field='enterprise' data-sortable='true' data-width="35"
                                    data-width-unit="%"><span
                                        title="Предприятие">Предприятие</span></th>
                                <th data-field='description' data-sortable='true' data-width="35" data-width-unit="%">
                                    <span title="Описание">Описание</span></th>
                                <th data-field='toolList' data-width="100" data-formatter="toolListFormatter"><span
                                        title="Список инструментов">Список инструментов</span></th>
                                <th data-field='actions' data-width="100" data-formatter="actionToolsFormatter"><span
                                        title="Действия">Действия</span></th>
                            </tr>
                            </thead>
                        </table>
                        <div id="customToolsToolbar" class="custom-toolbar-content" style="display: flex;">
                            <button id="addPlanButton" class="btn btn_vending" type="button" style="padding-right: 30px; padding-left: 30px;" onclick="window.location.href='./screen_8_append_plan.html?token='+localStorage.getItem('token');">
                                Добавить чертёж
                            </button>
                        </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно подтверждения удаления -->
        <div class="modal fade modal-dialog-scrollable" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <div style="display: flex; align-items: center; width: 100%;">
                            <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); display: flex; align-items: center; justify-content: center; margin-right: 16px; flex-shrink: 0;">
                                <i class="bi bi-exclamation-triangle-fill" style="color: white; font-size: 24px;"></i>
                            </div>
                            <div style="flex: 1;">
                                <h5 class="modal-title" id="deleteConfirmModalLabel" style="margin: 0; font-size: 1.25rem; font-weight: 600;">Подтверждение удаления</h5>
                                <p id="deleteConfirmMessage" style="margin: 0; margin-top: 4px; font-size: 1rem; color: rgba(255,255,255,0.9); line-height: 1.4; font-weight: 400;">Вы уверены, что хотите выполнить это действие?</p>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelDeleteBtn">Отмена</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
