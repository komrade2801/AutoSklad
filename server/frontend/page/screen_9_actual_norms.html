<!DOCTYPE html>
<html lang="ru" style="height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <script type="module" src="../scripts/actual_norms/init_9_actual_norms.js"></script>
    <title>Актуальные нормы сотрудников</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/dropdown_list.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
<!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->
</head>
<body onload="initialization('screen_9_actual_norms')" class="d-flex justify-content-center" id="body"
      style="flex-direction: column; margin: 0; width: 100%; height: 100%; padding: 0; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">

  <div id="membrane"></div>
  <div id="modal_window_confirmation">
    <span style="font-size: 24px;">Вы уверены, что хотите удалить норму?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Сотрудник: </span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Номерклатура: </span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">На руках не более: </span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Количество периодов: </span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Дата начала действия нормы: </span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="show_conf('none')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending" onclick="show_conf('none')">Удалить</button>
    </div>
  </div>
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
    <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
    </div>
    <div class="tab-pane fade show active d-flex" style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
        <div id="column-1" class="d-flex" style="padding: 10px; flex-direction: column; width: calc(100% - 225px); height: 100%; overflow: auto;">

        </div>
        <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; justify-content: space-between; width: 225px; height: calc(100vh - 122px); margin-right: 10px;">
          <div style="width: 100%; height: 70px; margin-top: 10px;">
            <div id="user" style="display: flex; flex-direction: row;">
              <button class="btn_vending" type="button" style="width: 190px;">Сотрудник</button>
              <button class="btn_vending dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false" type="button" style="width: 35px;"></button>
              <div class="dropdown-menu dropdown-menu-div"></div>
            </div>
            <button class="btn_vending" type="button" onclick="window.location.href='./screen_9_1_append_norm.html';">Добавить норму</button>
          </div>
          <div class="card" style="width: 225px; border: 20px; border-radius: 5px; border-color: rgb(0,49,114); font-size: 16px;">
            <div class="card-body" style="color: rgb(0,49,114); padding: 10px;">
              <h6 class="card-title" >Подсказка:</h6>
              <p class="card-text" style="font-family: Arial;">Ошибочно удалённую норму вернуть невозможно. При необходимости создайте её заново через "Добавить норму".</p>
            </div>
          </div>
          <div style="width: 100%; margin-bottom: 10px;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
