    <style>
      .droppable {
          border: 1px rgb(255, 255, 255);
          padding: 1px;
          margin: 1px;
          min-height: 50px;
          min-width: 44px;
          text-align: center;
          user-select: none;
      }

      .draggable {
        user-select: none;
      }

      .btn_vending {
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(black, rgb(131,173,239) 1%, rgb(120,158,217) 97%, white), rgb(0,49,114);
        border-color: rgb(255, 255, 255);
        border-radius: 5px;
        color: rgb(0,49,114);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .btn_vending_active {
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgb(0,49,114);
        border-color: rgb(80, 130, 179);
        border-radius: 5px;
        color: rgb(199, 224, 249);
        font-weight: bold;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1;
        width: 225px;
        height: 35px;
        margin-top: 2px;
      }

      .search-container {
            position: relative;
            width: 140px;
      }

      .search-input {
          width: 100%;
          height: 30px;
          padding-right: 30px;
          box-sizing: border-box;
          border: 1px solid #ccc;
          border-radius: 4px;
          outline: none;
      }

      .search-icon {
          position: absolute;
          top: 50%;
          right: 5px;
          transform: translateY(-50%);
          cursor: pointer;
      }

       .suggestions {
           position: absolute;
           top: 35px;
           width: 100%;
           border: 1px solid #ccc;
           border-top: none;
           background: white;
           z-index: 1000;
           border-radius: 0 0 4px 4px;
           max-height: 150px;
           overflow-y: auto;
           display: none;
       }

       .suggestions div {
           padding: 5px;
           cursor: pointer;
       }

       .suggestions div:hover {
           background-color: #f0f0f0;
       }
    </style>
</head>
<body class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
    <div id="user_information" class="d-flex ms-auto">
      <span id="userRole" style="color: rgb(78,155,229); font-size: 22px; font-weight: bold;"></span>
      <span style="color: rgb(78,155,229); font-size: 22px; font-weight: bold;">,&nbsp;</span>
      <span id="userName" style="margin-right: 5px; color: rgb(78,155,229); font-size: 22px; font-weight: bold;"></span>
      <span id="userPatronymic" style="color: rgb(78,155,229); margin-right: 15px; font-size: 22px; font-weight: bold;"></span>
    </div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
  // Извлекаем данные пользователя, сохраненные в localStorage (объект должен содержать: role_id, first_name, second_name, family)
  const userDataJSON = localStorage.getItem('user');
  if (!userDataJSON) {
    console.error('Информация о пользователе не найдена в localStorage');
    return;
  }

  const userData = JSON.parse(userDataJSON);

  // Выполняем запрос к эндпоинту для получения информации о роли по role_id
  fetch(`/backend/roles/${userData.role_id}`, {
    method: 'GET',
    headers: {
      'Authorization': `Bearer ${localStorage.getItem('token')}`,
      'Content-Type': 'application/json'
    }
  })
  .then(response => {
    if (!response.ok) {
      throw new Error('Ошибка получения данных о роли');
    }
    return response.json();
  })
  .then(roleData => {
    // Находим элементы для вывода данных
    const roleElement = document.getElementById('userRole');
    const nameElement = document.getElementById('userName');
    const patronymicElement = document.getElementById('userPatronymic');

    // Проверяем наличие необходимых полей и вставляем данные
    if (roleElement) {
      // В roleData ожидается, что название роли хранится в поле name
      roleElement.textContent = roleData.name;
    }
    if (nameElement) {
      // Формируем ФИО: фамилия + имя
      nameElement.textContent = `${userData.family} ${userData.first_name}`;
    }
    if (patronymicElement) {
      // Отчество пользователя
      patronymicElement.textContent = userData.second_name;
    }
  })
  .catch(error => {
    console.error('Ошибка при получении данных о роли: ', error);
  });
});
</script>

</body>
