{# templates/navbar.html #}
<div class="container-fluid navbar-container" style="height:100%">

    <img fetchpriority="high"
         src="{{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }}"
         class="custom-logo" alt="Автосклад промышленный вендинг для выдачи инструментов" decoding="async"
         srcset="{{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }} 1999w, {{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }} 300w, {{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }} 1024w, {{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }} 768w, {{ url_for('assets', path='/img/cropped-ver1-2-scaled-1.png') }} 1536w"
         sizes="(max-width: 1999px) 100vw, 1999px">

    <h1 id="screen_main_name" class="d-flex main-screen-title">
        {{ screen_name }}
    </h1>


    <div class="collapse navbar-collapse d-flex" id="navcol-2">
        <ul class="navbar-nav">
            {%- for key, label in buttons %}
            <li class="nav-item">
                <a class="nav-link {% if key==screen_key %}active{% endif %}"
                   href="{{ url_for(request.scope.endpoint, page=key) }}">
                    {{ label }}
                </a>
            </li>
            {%- endfor %}
        </ul>
    </div>

  <div id="user_information" class="d-flex ms-auto" style="overflow-wrap: break-word; word-break: break-word; margin-right: 15px;">
    <span style="color:#4E9BE5;font-size:22px;font-weight:bold;">
      {{ user_role }},&nbsp;
    </span>
        <span style="color:#4E9BE5;font-size:22px;font-weight:bold;">
      {{ user_fullname }}
    </span>
    </div>

    <button id="in_screen_user_out_btn" class="btn_vending"
            type="button" onclick="window.location.href='/'; localStorage.removeItem('token')"
            style="width:90px;font-family:Arial Black;font-size:18px;">
        Выйти
    </button>
</div>
