<!DOCTYPE html>
<html lang="ru" style="margin: 0; height: 100%;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Добавление устройства</title>
    <script type="module" src="../scripts/append_device/init.js?v=1.11"></script>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/Navbar-Right-Links-icons.css">
    <script src="../scripts/authorisation/navigate_token.js?v=1.11"></script>
    <script type="module" src="../scripts/append_device/modal_window.js?v=1.11"></script>
    <script src="../scripts/append_device/progress_bar.js?v=1.11"></script>
<!--    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>-->

    <link rel="stylesheet" href="../style/titles.css">
    <link rel="stylesheet" href="../style/background.css">
    <link rel="stylesheet" href="../style/button_style.css">
    <link rel="stylesheet" href="../style/style_modal_window.css">
    <!--<script src="./clear_all_form.js"></script>-->

</head>
<body onload="initialization('screen_22_append_device')" class="d-flex justify-content-center" id="body"
      style="margin-bottom: 0; width: 100%; height: 100%; padding-bottom: 0px; background: repeating-linear-gradient(black, rgb(47,70,105) 0%, rgb(131,149,174) 99%, rgb(247, 248, 251) 100%);">
  <div id="membrane"></div>
  <div class="modal_window" id="modal_window_confirmation">
    <span style="font-size: 24px; padding-left: 10px;">Вы уверены, что хотите отменить добавление устройства?</span>
    <span style="display: flex; width: 80%; align-items: start; margin-top: 15px; ">Введённые данные не сохранятся.</span>
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="window.location.href='/screen_21_all_device.html?token='+localStorage.getItem('token')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending" onclick="window.location.href='/screen_21_all_device.html?token='+localStorage.getItem('token')">Отменить добавление</button>
    </div>
  </div>
  <div class="modal_window" id="modal_no_devices_found">
    <span id="no_devices_title" style="font-size: 24px;">Доступне устройства не найдены.</span>
    <span style="width: 100%; padding-left: 10px;">Задать IP:</span>
    <input id="IPInput" class="form-control me-2" type="text" placeholder="192.168.0.10" style="margin-top: 5px; width: 90%;">
    <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Задать порт:</span>
    <input id="portInput" class="form-control me-2" type="text" placeholder="65535" style="width: 90%;">
    <div style="display: flex; flex-direction: row; margin-top: 50px;">
      <button class="btn_vending" onclick="show_no_devices_found('none')" style="margin-right: 20px;">Назад</button>
      <button class="btn_vending" onclick="readSignature()">Считать сигнатуры</button>
    </div>
  </div>
  <div class="modal_window" id="modal_progress_bar">
     <div class="progress-bar">
         <div class="progress-fill" id="progressFill"></div>
     </div>
     <div class="progress-text" id="progressText">0%</div>
  </div>
  <div class="modal_window" id="modal_window_signature">
    <span id="device_number" style="font-size: 20px; font-weight: bold;"></span>
    <span id="device_name" style="margin-top: 10px;"></span>
    <span id="device_description" style="margin-top: 10px;"></span>

    <div id="device_details"></div>

    <div style="display: flex; justify-content: flex-end; margin-top: 30px;">
      <button class="btn_vending" onclick="show_signature('none')">Закрыть</button>
      <button class="btn_vending" onclick="onAddDeviceClick()">Добавить устройство</button>
    </div>
  </div>
  <div class="modal_window" id="modal_window_error">
    <span style="font-size: 24px;">Устройство не найдено.</span>
    <button class="btn_vending" onclick="show_error('none')">Ок</button>
  </div>
  <div class="d-flex flex-column" style="height: 100%; width: 100%; position: static; margin-left: 0px; color: rgb(255,255,255);">
    <nav id="navbar" class="navbar navbar-light navbar-expand d-flex flex-row mx-auto align-items-center justify-content-center py-3" style="width: 100%;height: 100px;margin-top: 10px;margin-left: 0px;">
    </nav>
    <div class="d-flex" style="height: calc(100% - 120px); margin-top:10px; border-top: 2px solid rgb(78,155,229);">
    <div class="flex-column nav-pills" id="v-pills-tab" aria-orientation="vertical" style="width: 235px; padding-left: 10px; margin-top: 10px;">
    </div>
    <div class="tab-pane fade show active d-flex" style="display: flex; flex-direction: row; flex-wrap: nowrap; width: calc(100% - 235px); height: 100%; padding: 0px;">
        <div id="column-1" class="d-flex" style="flex-direction: column; width: calc(50% - 112px); height: 100%; padding: 0 10px 10px 10px;">
          <span id="title_available_devices" style="width: 100%; margin-top: 10px; padding-left: 10px;">Доступные устройства:</span>
          <div class="d-flex" id="devices" style="flex-direction: column; width: 100%; height: 80%; overflow-y: auto; padding: 10px; border: 2px solid rgb(78, 155, 229); border-radius: 5px;"></div>
          <button class="btn_vending" id="btn_back" onclick="backClick()" style="display: none; margin-top: 10px; width: 40px; margin-left: 10px;">
            <img src="../assets/img/btn_back.png" alt="Назад" style="width: 35px; height: 35px;" />
          </button>
        </div>
        <div id="column-2" style="display: flex; flex-direction: column; width: calc(50% - 113px); height: 100%; box-sizing: border-box; padding: 0 10px 10px 10px;">
            <div id="add_data_device" style="display: none; flex-direction: column; width: 100%; height: 80%; border: 2px solid rgb(78, 155, 229); border-radius: 5px; padding: 10px; box-sizing: border-box;">
              <span style="width: 100%; padding-left: 10px;">Название:</span>
              <input id="enterpriseInput" class="form-control me-2" type="text" placeholder="Вендинг №1" style="margin-top: 5px;">
              <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Номер устройства:</span>
              <input id="designationInput" class="form-control me-2" type="text" placeholder="XXXX.DDDD.xxxx.xxxx.xxxx">
              <span style="width: 100%; margin-top: 10px; padding-left: 10px;">Описание:</span>
              <input id="nameInput" class="form-control me-2" type="text" placeholder="Главный цех">
            </div>
        </div>
        <div id="column-3" class="d-flex" style="display: flex; flex-direction: column; justify-content: space-between; width: 225px; height: 100%; margin-right: 10px;">
          <div style="width: 100%; height: 70px; margin-top: 10px;">
            <button class="btn_vending" type="button" onclick="openModalProgressBar()">Поиск устройств</button>
            <button class="btn_vending" type="button" onclick="openModalNoDevicesFound()">Добавить по IP</button>
          </div>
          <div class="card" style="display: none; width: 225px; border: 20px; border-radius: 5px; border-color: rgb(0,49,114); font-size: 16px;">
            <div class="card-body" style="color: rgb(0,49,114); padding: 10px;">
              <h6 class="card-title" ></h6>
              <p class="card-text" style="font-family: Arial;"></p>
            </div>
          </div>
          <div style="width: 100%; margin-bottom: 10px;">
            <button class="btn_vending" type="button" onclick="clearAllForm()">Очистить все поля</button>
            <button class="btn_vending" type="button" onclick="openModalConf()">Отмена</button>
            <button class="btn_vending" type="button" id="saveButton">Сохранить</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
